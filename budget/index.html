<!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>月光存股模擬人生｜聯邦調財局</title><meta name="theme-color" content="#E2C77E"><meta name="description" content="拯救月光族：532／631 法則記帳＋模擬存股學習。資料只存在你的手機。">
<style>
:root{--bg:#F3E6C4;--card:#FFFAEE;--mus:#E2C77E;--ink:#3a2a14;--red:#C8321E;--mut:#8a7650}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);padding-bottom:84px}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--mus);border-bottom:3px solid var(--red)}
header img{width:40px;height:40px}header b{font-size:18px}header small{display:block;color:var(--mut);font-size:12px}
main{padding:12px 14px;max-width:480px;margin:auto}.card{background:var(--card);border:1.5px solid #d9c38f;border-radius:14px;padding:14px;margin-bottom:12px;position:relative;overflow:hidden}
.big{text-align:center}.big .lbl{font-size:15px;color:var(--mut)}.big .amt{font-size:52px;font-weight:900;color:var(--red);line-height:1.1;margin:4px 0}
.row{display:flex;justify-content:space-between;font-size:14px;margin:4px 0}.bar{height:10px;background:#eadbb3;border-radius:6px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--red)}
.bar.g i{background:#6b8e3d}h3{margin:0 0 8px;font-size:16px}
input,select{font:inherit;padding:10px;border:1.5px solid #cdb67f;border-radius:10px;background:#fff;width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.chip{padding:6px 12px;border-radius:20px;border:1.5px solid var(--red);background:#fff;color:var(--red);font-size:14px}.chip.on{background:var(--red);color:#fff}
button.btn{font:inherit;font-weight:700;background:var(--red);color:#fff;border:0;border-radius:10px;padding:11px;width:100%;margin-top:8px}button.sec{background:#fff;color:var(--red);border:1.5px solid var(--red)}
ul{list-style:none;padding:0;margin:0}li{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px dashed #d9c38f;font-size:14px}li .x{border:0;background:none;color:var(--red);font-size:18px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:2px solid var(--red)}nav button{flex:1;border:0;background:none;padding:10px 0 14px;font:inherit;font-size:13px;color:var(--mut)}nav button.on{color:var(--red);font-weight:800}
.alarm{position:absolute;right:8px;top:8px;border:3px solid var(--red);color:var(--red);font-weight:900;padding:4px 10px;border-radius:8px;transform:rotate(-12deg);font-size:18px;animation:st .5s ease-out;background:rgba(255,250,238,.85)}
@keyframes st{0%{transform:scale(3) rotate(-12deg);opacity:0}70%{transform:scale(.9) rotate(-12deg);opacity:1}100%{transform:scale(1) rotate(-12deg)}}
.stick{text-align:center}.stick .lv{font-size:40px;font-weight:900;color:var(--red)}.poem{font-size:17px;letter-spacing:2px;margin:8px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.q{display:flex;justify-content:space-between;align-items:center;margin:6px 0;font-size:14px;gap:6px}.q span{flex:1}
.score{font-size:34px;font-weight:900;color:var(--red);text-align:center}footer{text-align:center;font-size:12px;color:var(--mut);margin:10px 0}.hide{display:none}.note{font-size:12px;color:var(--mut)}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}label{display:block;font-size:13px;color:var(--mut);margin:6px 0}
.mini{background:#fff;border:1px solid #e3d2a4;border-radius:10px;padding:8px;text-align:center}.mini small{display:block;font-size:12px;color:var(--mut)}.mini b{font-size:19px}.mini.wide{margin-top:8px}
.up{color:var(--red)}.dn{color:#2f7a3a}.tip{margin-top:10px;background:#fff3e6;border:1.5px dashed var(--red);border-radius:10px;padding:8px;font-size:14px;text-align:left}
.warn{background:var(--red);color:#fff;border-radius:10px;padding:8px 10px;font-size:13px;margin-bottom:12px;font-weight:700}.tag{font-size:11px;border:1px solid var(--mut);color:var(--mut);border-radius:6px;padding:0 4px;margin-left:4px}
.hold{border-bottom:1px dashed #d9c38f;padding:6px 0}.hold svg{vertical-align:middle}li{cursor:pointer}nav button{font-size:12px;padding:6px 0 12px}button.x{border:0;background:none;color:var(--red);font-size:18px}
</style></head><body>
<header><img src="assets/stamp.png" alt=""><div><b>月光存股模擬人生</b><small>聯邦調財局 @wuji_fbi</small></div></header>
<main id="app"></main>
<footer>僅供參考娛樂，非投資建議｜模擬學習用，本站不推薦任何個股<br>資料只存在你的手機｜行情：臺灣證券交易所、證券櫃檯買賣中心 公開資料</footer>
<nav id="nav"></nav>
<script>
const K='wuji_moon_v1',$=s=>document.querySelector(s),fmt=n=>'$'+Math.round(n).toLocaleString('zh-TW'),f2=n=>(+n).toLocaleString('zh-TW',{maximumFractionDigits:2});
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const CATS=[['餐飲','n'],['交通','n'],['日用','n'],['醫療','n'],['家庭','n'],['娛樂','f'],['購物','f'],['社交','f'],['其他','f']];
const BK={n:'必要',f:'娛樂'};
const DEF_FIXED=[['房租',0],['伙食',0],['水電瓦斯',0],['家庭支出',0],['交通費',0]];
const DEMO=new URLSearchParams(location.search).has('demo');
let S=DEMO?null:JSON.parse(localStorage.getItem(K)||'null');S=S||{setup:null,entries:[],buys:[],draw:{}};
const save=()=>{if(!DEMO)localStorage.setItem(K,JSON.stringify(S))};
const ds=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
function payOn(y,m,p){const last=new Date(y,m+1,0).getDate();return new Date(y,m,Math.min(p,last))}
function cycleOf(t){const p=S.setup.payday;let s=payOn(t.getFullYear(),t.getMonth(),p);if(s>t)s=payOn(t.getFullYear(),t.getMonth()-1,p);return{s,n:payOn(s.getFullYear(),s.getMonth()+1,p)}}
function cyc(s,n){const st=S.setup,[rn,rs,rf]=st.rule,sal=st.salary,S0=ds(s),N0=ds(n);
 const ex=S.entries.filter(e=>e.d>=S0&&e.d<N0),nec=ex.filter(e=>e.b=='n').reduce((a,e)=>a+e.a,0),fun=ex.filter(e=>e.b=='f').reduce((a,e)=>a+e.a,0);
 const fixed=st.fixed.reduce((a,f)=>a+(+f.a||0),0),N=sal*rn/100,Sv=sal*rs/100,F=sal*rf/100;
 const necLeft=N-fixed-nec,funLeft=F-fun;
 // over-spend in one bucket eats savings first
 const save_=Sv+Math.min(0,necLeft)+Math.min(0,funLeft);
 const investable=Math.max(0,save_+Math.max(0,necLeft)); // 儲蓄投資 + 沒花完的必要開銷（娛樂餘額不算）
 const invested=S.buys.filter(b=>b.d>=S0&&b.d<N0).reduce((a,b)=>a+b.amt,0);
 return{s,n,S0,N0,ex,nec,fun,fixed,N,Sv,F,necLeft,funLeft,investable,invested,remain:Math.max(0,sal-fixed-nec-fun-invested)}}
function calc(){const t=today(),c=cycleOf(t);const C=cyc(c.s,c.n);
 // 跨月累積可投資金額：從開始使用的那一期起每期累加
 let tot=0,s=cycleOf(new Date(S.setup.start+'T00:00')).s;
 for(let k=0;k<240&&s<=t;k++){const n=payOn(s.getFullYear(),s.getMonth()+1,S.setup.payday);tot+=cyc(s,n).investable;s=n}
 const P=port();C.cashAvail=Math.max(0,tot-S.buys.reduce((a,b)=>a+b.amt,0)+P.cash);C.P=P;C.T=ds(t);return C}
function streak(){const set=new Set(S.entries.map(e=>e.d));let d=today(),c=0;if(!set.has(ds(d)))d.setDate(d.getDate()-1);while(set.has(ds(d))){c++;d.setDate(d.getDate()-1)}return c}
// ---------- 市場資料 ----------
let PR=null,HI=null,DV=null;
async function loadData(){try{const[a,b,c]=await Promise.all(['prices','history','dividends'].map(n=>fetch('data/'+n+'.json',{cache:'no-cache'}).then(r=>r.json())));PR=a;HI=b;DV=c}catch(e){PR=PR||{stocks:{},updated:null}}
 if(DEMO)demo();render()}
const stk=c=>PR&&PR.stocks[c];
function sratio(v){return v>1?v/1000:v} // 無償配股率：每股配發股數
function port(){const T=ds(today()),by={};S.buys.forEach(b=>(by[b.code]=by[b.code]||[]).push(b));let cash=0,mv=0,cost=0,divc=0;const rows=[];
 for(const code in by){const ev=by[code].map(b=>({d:b.d,k:0,b})).concat(((DV&&DV.list)||[]).filter(x=>x.code==code&&x.ex<=T).map(x=>({d:x.ex,k:1,x}))).sort((p,q)=>p.d<q.d?-1:p.d>q.d?1:p.k-q.k);
  let sh=0,c0=0,dc=0,ds_=0;for(const e of ev){if(!e.k){sh+=e.b.sh;c0+=e.b.amt}else if(sh>0){const cd=sh*e.x.cash,sd=Math.floor(sh*sratio(e.x.stock));dc+=cd;ds_+=sd;sh+=sd}}
  const p=stk(code),px=p?p.c:(by[code].at(-1).px),v=sh*px;cash+=dc;mv+=v;cost+=c0;divc+=dc;rows.push({code,name:p?p.n:by[code][0].n,sh,px,v,c0,dc,ds:ds_,pl:v-c0})}
 return{rows,cash,mv,cost,divc,pl:mv-cost}}
function spark(code,w=120,h=34){const i=HI&&HI.c[code];if(!i)return'<span class="note">尚無走勢</span>';const v=i.filter(x=>x!=null);if(v.length<2)return'<span class="note">走勢資料累積中</span>';
 const mn=Math.min(...v),mx=Math.max(...v),r=mx-mn||1,pts=v.map((y,k)=>(k/(v.length-1)*w).toFixed(1)+','+(h-2-(y-mn)/r*(h-4)).toFixed(1)).join(' ');
 return`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline fill="none" stroke="#7a5a1e" stroke-width="1.6" points="${pts}"/></svg>`}
// ---------- 畫面 ----------
let tab=new URLSearchParams(location.search).get('tab')||'home',cat='餐飲',bk='n',lm=null,q='',pick=null;
function nav(){$('#nav').innerHTML=[['home','🏠','首頁'],['add','✏️','記帳'],['book','📒','帳本'],['inv','📈','存股'],['draw','🎋','抽籤'],['set','⚙️','設定']].map(([k,i,l])=>`<button class="${tab==k?'on':''}" onclick="go('${k}')">${i}<br>${l}</button>`).join('')}
function go(k){tab=S.setup?k:'set';scrollTo(0,0);render()}
function render(){nav();const A=$('#app');if(!S.setup||tab=='set')return A.innerHTML=setupV();({home,add,book,inv,draw})[tab](A)}
function setupV(){const st=S.setup||{salary:'',payday:5,rule:[60,30,10],fixed:DEF_FIXED.map(([n,a])=>({n,a}))};
 return`<div class="card"><h3>💰 發薪日設定</h3><label>每月薪資（實領）<input id="sal" type="number" inputmode="numeric" value="${st.salary}" placeholder="例如 35000"></label>
 <label>每月發薪日<input id="pd" type="number" min="1" max="31" value="${st.payday}"></label>
 <h3 style="margin-top:12px">📐 分配法則</h3><div class="chips"><button class="chip" onclick="setR(50,30,20)">532 法則</button><button class="chip" onclick="setR(60,30,10)">631 法則</button></div>
 <div class="grid3"><label>必要開銷 %<input id="r0" type="number" value="${st.rule[0]}"></label><label>儲蓄投資 %<input id="r1" type="number" value="${st.rule[1]}"></label><label>娛樂彈性 %<input id="r2" type="number" value="${st.rule[2]}"></label></div>
 <p class="note">建議：必要 50–60%、儲蓄投資 20–30%（擺脫月光族的核心）、娛樂 10–20%，合計 100%。</p></div>
 <div class="card"><h3>📌 每月固定扣款（從「必要開銷」先扣）</h3><div id="fx">${st.fixed.map((f,i)=>fxRow(f,i)).join('')}</div><button class="btn sec" onclick="addFx()">＋ 新增項目</button></div>
 <button class="btn" onclick="doSetup()">儲存設定</button>${S.setup?`<button class="btn sec" onclick="if(confirm('確定清除所有資料？'))(localStorage.removeItem(K),location.reload())">清除全部資料</button>`:''}`}
const fxRow=(f,i)=>`<div class="q"><input class="fn" value="${esc(f.n)}" placeholder="項目"><input class="fa" type="number" inputmode="numeric" value="${f.a||''}" placeholder="金額" style="width:110px"><button class="x" onclick="this.parentNode.remove()">✕</button></div>`;
function addFx(){$('#fx').insertAdjacentHTML('beforeend',fxRow({n:'',a:''},0))}
function setR(a,b,c){$('#r0').value=a;$('#r1').value=b;$('#r2').value=c}
function doSetup(){const sal=+$('#sal').value,r=[+$('#r0').value,+$('#r1').value,+$('#r2').value];if(!(sal>0))return alert('請輸入薪資');if(r[0]+r[1]+r[2]!=100)return alert('三個比例加起來要等於 100%');
 const fixed=[...document.querySelectorAll('#fx .q')].map(d=>({n:d.querySelector('.fn').value.trim(),a:+d.querySelector('.fa').value||0})).filter(f=>f.n);
 if(fixed.reduce((a,f)=>a+f.a,0)>sal*r[0]/100&&!confirm('固定扣款超過必要開銷預算，超出的部分會從儲蓄扣。確定嗎？'))return;
 S.setup={salary:sal,payday:Math.min(31,Math.max(1,+$('#pd').value||5)),rule:r,fixed,start:S.setup?S.setup.start:ds(today())};save();tab='home';render()}
function home(A){const c=calc(),P=c.P,leak=c.necLeft<0||c.funLeft<0,days=Math.max(1,Math.round((c.n-today())/864e5));
 const tips=['先停一下非必要消費，把想買的東西放三天再決定','超出的部分已從儲蓄先補上，下週少一次外食就追回來了','打開帳本看看哪個分類花最多，小改變就有大差別'];
 A.innerHTML=`<div class="card big">${leak?'<div class="alarm">漏財警報</div>':''}<div class="lbl">本月剩餘存款</div><div class="amt">${fmt(c.remain)}</div>
 <div class="note">${ds(c.s)} ～ ${ds(new Date(c.n-864e5))}・距下次發薪 ${days} 天</div>
 <div class="grid2" style="margin-top:10px"><div class="mini"><small>🎉 本月娛樂可花</small><b>${fmt(Math.max(0,c.funLeft))}</b></div><div class="mini"><small>🏠 必要開銷餘額</small><b>${fmt(Math.max(0,c.necLeft))}</b></div></div>
 ${leak?`<div class="tip">🔔 ${c.necLeft<0?'必要開銷':'娛樂花費'}有點超出預算了，別擔心！💡 ${tips[new Date().getDate()%3]}</div>`:''}</div>
 <div class="card"><h3>📈 模擬存股（學習用）</h3><div class="grid2"><div class="mini"><small>總市值</small><b>${fmt(P.mv)}</b></div><div class="mini"><small>累積股利</small><b>${fmt(P.divc)}</b></div>
 <div class="mini"><small>未實現損益</small><b class="${P.pl>=0?'up':'dn'}">${P.pl>=0?'+':''}${fmt(P.pl).replace('$-','-$')}</b></div><div class="mini"><small>可投入模擬資金</small><b>${fmt(c.cashAvail)}</b></div></div>
 <div class="mini wide"><small>💎 累積存款＋模擬存股 總資產</small><b>${fmt(c.cashAvail+P.mv)}</b></div>
 ${P.rows.length?`<ul style="margin-top:8px">${P.rows.map(r=>`<li><span><b>${esc(r.name)}</b> <span class="note">${r.code}・${f2(r.sh)} 股</span></span><span>${fmt(r.v)}</span></li>`).join('')}</ul>`:'<p class="note">還沒有模擬持股，到「存股」頁自己搜尋想學習的標的。</p>'}
 <p class="note">模擬學習用，非投資建議，本站不推薦任何個股</p></div>
 <div class="card"><div class="row"><b>🔥 連續記帳 ${streak()} 天</b><span>${S.draw[c.T]?'今日已抽籤 ✅':'<a href="#" onclick="go(\'draw\')">去抽今日籤 →</a>'}</span></div></div>`}
function add(A){const T=ds(today()),list=S.entries.filter(e=>e.d==T).reverse();
 A.innerHTML=`<div class="card"><h3>✏️ 記一筆支出</h3><input id="amt" type="number" inputmode="numeric" placeholder="金額">
 <div class="chips">${CATS.map(([k,b])=>`<button class="chip ${cat==k?'on':''}" onclick="cat='${k}';bk='${b}';render()">${k}</button>`).join('')}</div>
 <div class="chips"><span class="note" style="align-self:center">算在：</span>${['n','f'].map(b=>`<button class="chip ${bk==b?'on':''}" onclick="bk='${b}';render()">${BK[b]}</button>`).join('')}</div>
 <input id="nt" placeholder="備註（選填）"><button class="btn" onclick="addE()">記下來</button></div>
 <div class="card"><h3>今天的帳（${list.length} 筆）</h3><ul>${list.map(li).join('')||'<p class="note">今天還沒記帳，記一筆就能延續連續天數！</p>'}</ul></div>`}
const li=e=>`<li><span>${esc(e.c)}<span class="tag">${BK[e.b]}</span> <span class="note">${esc(e.note||'')}</span></span><span>${fmt(e.a)} <button class="x" onclick="delE(${e.id})">✕</button></span></li>`;
function addE(){const a=+$('#amt').value;if(!(a>0))return alert('請輸入金額');S.entries.push({id:Date.now(),d:ds(today()),a,c:cat,b:bk,note:$('#nt').value.trim().slice(0,40)});save();render()}
function delE(id){if(!confirm('刪除這筆？'))return;S.entries=S.entries.filter(e=>e.id!=id);save();render()}
function book(A){const ms=[...new Set(S.entries.map(e=>e.d.slice(0,7)).concat(ds(today()).slice(0,7)))].sort().reverse();lm=lm&&ms.includes(lm)?lm:ms[0];
 const ex=S.entries.filter(e=>e.d.startsWith(lm)),tot=ex.reduce((a,e)=>a+e.a,0),bc={};ex.forEach(e=>bc[e.c]=(bc[e.c]||0)+e.a);const mx=Math.max(1,...Object.values(bc));
 const days={};ex.forEach(e=>(days[e.d]=days[e.d]||[]).push(e));
 A.innerHTML=`<div class="card"><h3>📒 帳本</h3><select onchange="lm=this.value;render()">${ms.map(m=>`<option ${m==lm?'selected':''}>${m}</option>`).join('')}</select>
 <div class="row" style="margin-top:8px"><span>本月支出 ${ex.length} 筆</span><b>${fmt(tot)}</b></div>
 ${Object.entries(bc).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="row"><span>${k}</span><span>${fmt(v)}・${Math.round(v/tot*100)}%</span></div><div class="bar"><i style="width:${v/mx*100}%"></i></div>`).join('')||'<p class="note">這個月還沒有紀錄</p>'}
 <p class="note">💡 常回來看帳本，找出最常漏財的分類，是增加存款最快的方法。</p></div>
 ${Object.keys(days).sort().reverse().map(d=>`<div class="card"><div class="row"><b>${d}</b><span>${fmt(days[d].reduce((a,e)=>a+e.a,0))}</span></div><ul>${days[d].map(li).join('')}</ul></div>`).join('')}`}
function inv(A){const c=calc(),P=c.P,ql=q.trim().toUpperCase();let res=[];
 if(ql&&PR)res=Object.entries(PR.stocks).filter(([k,v])=>k.startsWith(ql)||v.n.toUpperCase().includes(ql)).sort((a,b)=>a[0]<b[0]?-1:1).slice(0,20);
 const p=pick&&stk(pick);
 A.innerHTML=`<div class="warn">⚠️ 模擬學習用，非投資建議，本站不推薦任何個股。價格為公開資料最近收盤價，可能延遲。</div>
 <div class="card"><div class="grid2"><div class="mini"><small>可投入模擬資金</small><b>${fmt(c.cashAvail)}</b></div><div class="mini"><small>持股總市值</small><b>${fmt(P.mv)}</b></div>
 <div class="mini"><small>累積股利（現金）</small><b>${fmt(P.divc)}</b></div><div class="mini"><small>未實現損益</small><b class="${P.pl>=0?'up':'dn'}">${P.pl>=0?'+':''}${fmt(P.pl).replace('$-','-$')}</b></div></div>
 <p class="note">可投入資金＝每月「儲蓄投資」＋沒花完的必要開銷＋已領現金股利，減去已買入金額。存股模式：只能買、不能賣。</p></div>

function buy(){const sh=Math.floor(+$('#sh').value),p=stk(pick);if(!(sh>0))return alert('請輸入股數');const amt=Math.round(sh*p.c),c=calc();

 if(!confirm(`模擬買入 ${pick} ${p.n} ${sh} 股，約 ${fmt(amt)}？\n存股模式買了就不能賣喔。`))return;

function rng(s){let h=2166136261;for(const ch of s)h=Math.imul(h^ch.charCodeAt(0),16777619);return()=>((h=Math.imul(h^h>>>15,2246822507)^Math.imul(h^h>>>13,3266489909))>>>0)/4294967296}

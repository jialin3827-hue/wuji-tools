<style>

</style></head><body>
<header><span class="logo">📦 花壇備品倉儲</span><span class="sp"></span><button class="pill" id="lockBtn" onclick="logout()">登出</button></header>
<div id="lg" style="position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px"><form id="lf" style="width:100%;max-width:360px" autocomplete="on"><div class="logo" style="font-size:24px;text-align:center">📦 花壇備品倉儲</div><div class="lk" style="text-align:center;margin:6px 0 18px">僅限授權人員登入</div><label for="lu">帳號</label><input id="lu" name="username" autocomplete="username" autocapitalize="off" spellcheck="false" autofocus><label for="lp">密碼</label><input id="lp" name="password" type="password" autocomplete="current-password" inputmode="numeric" lang="en"><button class="btn ac" id="lb" type="submit">登入</button><div class="lk" style="text-align:center;margin-top:12px">內部備品管理，非正式 ERP・前端簡易登入，非企業級資安<br>電腦請用英文／數字鍵盤輸入密碼</div></form></div>

"押出機":[["感測溫度線"],["電磁開關","SC-0;TR-ON/3;S-P11;S-P21;S-P30T;S-P35T;MSO-P11;SP40T;MSO-SP21"],["溫度控制面板"],["FUSE","3A"],["皮帶","B-80;C-103;C-108;C-110;C-130;C-135;C-145;C-148;SPA-1457;SPA-1432;5V-710"],["斷路器","NF-250-CN;NF-100-CN 3P 50A;BH 2P 20A"],["方型電熱片","220V 1700W 228x75;220V 1800W 228x75;220V 3000W 280x120;220V 3200W 280x120"],["圓形電熱片","220V 1850W 127x150;220V 1350W 126x110;220V 2050W 126x145;220V 2500W 126x175;220V 2050W 126x160;220V 1700W 126x180"],["押出機散熱風車"],["主馬達","60HP;75HP"],["變頻器","60HP;75HP"],["變頻器","Mitsubishi FR-D720-070-NA"],["可程式定時器"],["濾網","40x0.25 165mm;46x0.25 150mm"],["震動台馬達"],["泵浦","四川川嶺 E2020 60HZ 2HP 2P"],["交織式防電擊電焊機"],["熱壓封口機","110V"],["天車遙控器"],["抽屜開關"]],

async function h(p){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("wuji-wh:"+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
const DEFU={admin:{pw:"1127",role:"admin"},hyman:{pw:"27397449",role:"stock"},viewer:{pw:"0000",role:"viewer"},"999":{pw:"0000",role:"viewer"}};const RN={admin:"管理員",stock:"進貨管理",viewer:"檢視者"};let tab="home",cat="all",q="",hm="all",sm="all",si="all";
async function users(){if(!S.users){S.users={};for(const u in DEFU)S.users[u]={h:await h(u+":"+DEFU[u].pw),role:DEFU[u].role};save()}
 if((S.uv||0)<2){for(const u of["admin","hyman"])S.users[u]={h:await h(u+":"+DEFU[u].pw),role:DEFU[u].role};S.uv=2;save()}
 if(S.uv<3){S.users["999"]={h:await h("999:0000"),role:"viewer"};S.uv=3;save()}return S.users}
const me=()=>{const x=JSON.parse(sessionStorage.getItem("whS")||"null");return x&&x.exp>Date.now()&&S.users&&S.users[x.u]?x:null};
const unlocked=()=>["admin","stock"].includes(me()?.role);const isAdmin=()=>me()?.role=="admin";

function lockUI(){const x=me();lockBtn.textContent=x?(x.role=="viewer"?"👁 ":"🔓 ")+x.u+"｜登出":"登出";lockBtn.className="pill"+(unlocked()?" on":"")}

const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tw=t=>new Date(t).toLocaleString("zh-TW",{timeZone:"Asia/Taipei",hour12:false});
const label=it=>it.name+(it.spec?" "+it.spec:"");
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.style.display="block";clearTimeout(e._t);e._t=setTimeout(()=>e.style.display="none",1600)}
function openM(x){sh.innerHTML=x;md.classList.add("on")}function closeM(){md.classList.remove("on")}
const FROMN={qty:"倉庫",floor:"現場",pend:"待修",rep:"送修中"};function fromTxt(f){return FROMN[f]||""}
function daysSince(dateStr){if(!dateStr)return null;const t=(typeof today=="function"?today():new Date().toLocaleDateString("sv-SE",{timeZone:"Asia/Taipei"}));const a=Date.parse(String(dateStr).slice(0,10)+"T00:00:00");const b=Date.parse(t+"T00:00:00");if(!isFinite(a)||!isFinite(b))return null;return Math.max(0,Math.round((b-a)/86400000))}
function daysLabel(dateStr){const d=daysSince(dateStr);return d==null?"":d===0?"・今天送出":"・已"+d+"天"}
let _ors=null;function orsList(){return _ors||(_ors=openRsend())}
function oldestRepDate(id){const ds=orsList().filter(e=>e.id==id&&e.date).map(e=>e.date).sort();return ds[0]||""}

function badgeScrap(){return `<span class="badge scrap">🗑已報廢</span>`}
const row=it=>`<div class="row" onclick="detail('${it.id}')" style="${it.pend||it.rep?"border-color:"+(it.rep?"#ff8c4266":"#f0b90b66"):""}"><div class="t"><b>${esc(label(it))} ${it.pend?badgePend():""}${it.rep?badgeRep(oldestRepDate(it.id)):""}</b><div class="s">${it.id}・${CATN[it.category]||esc(it.category)}${it.location?"・📍"+esc(it.location):""}</div></div><div class="q ${TOT(it)<=it.safety?"low":""}">${TOT(it)}<span class="s"> ${esc(it.unit)}</span><div class="s" style="font-size:11px">倉${it.qty}・場${it.floor||0}・待${it.pend||0}・修${it.rep||0}</div></div></div>`;
function render(){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t==tab));lockUI();mig();_ors=null;let o="";
if(tab=="home"){const low=S.items.filter(i=>TOT(i)<=i.safety);o=`<div class="cards"><div class="card"><div class="n">${S.items.length}</div><div class="l">品項數</div></div><div class="card"><div class="n">${S.items.reduce((a,i)=>a+TOT(i),0)}</div><div class="l">總庫存數</div><div class="s" style="font-size:11px">倉 ${S.items.reduce((a,i)=>a+i.qty,0)}・現場 ${S.items.reduce((a,i)=>a+(i.floor||0),0)}・待修 ${S.items.reduce((a,i)=>a+(i.pend||0),0)}・送修 ${S.items.reduce((a,i)=>a+(i.rep||0),0)}</div></div><div class="card warn"><div class="n">${low.length}</div><div class="l">低於最低庫存</div></div></div>`+(low.length?`<div class="row" style="border-color:var(--red);background:#2a1218" onclick="buyPop()"><div class="t"><b style="color:var(--red)">🛒 提醒採購：${low.length} 項已達最低庫存</b><div class="s">點一下查看全部待採購項目 ›</div></div></div>`:"");
 const ors=openRsend(),repN=S.items.reduce((a,i)=>a+(i.rep||0),0),pendN=S.items.reduce((a,i)=>a+(i.pend||0),0),scrapN=S.items.reduce((a,i)=>a+(i.scrap||0),0);
 if(pendN){o+=`<h3>⏳ 待修（${pendN} 件）</h3>`+S.items.filter(i=>(i.pend||0)>0).map(pendRow).join("")}
 if(ors.length||repN){o+=`<h3>🛠 送修中（${repN} 件・${ors.length} 筆未回）</h3>`+(ors.map(repRow).join("")||S.items.filter(i=>i.rep>0).map(row).join("")||`<div class="lk">無明細</div>`)}
 if(scrapN){o+=`<div class="row" onclick="tab='scrap';sm='all';si='all';render()"><div class="t"><b>🗑 累計報廢 ${scrapN}</b><div class="s">查看報廢紀錄與匯出 ›</div></div><div class="q">›</div></div>`}
 for(const c in CATN){const it=S.items.filter(i=>i.category==c);o+=`<div class="row catr" onclick="cat='${c}';tab='inv';render()"><div class="t"><b>${CATN[c]}</b><div class="s">${it.length} 項・待採購 <span class="${it.filter(LOWI).length?"low":""}">${it.filter(LOWI).length}</span>${(()=>{const p=it.reduce((a,i)=>a+(i.pend||0),0),r=it.reduce((a,i)=>a+(i.rep||0),0);return (p?"・⏳待修 "+p:"")+(r?"・🛠送修中 "+r:"")})()}</div></div><div class="q">›</div></div>`}
 o+=`<h3>🛒 待採購清單（總庫存 ≤ 最低庫存）</h3>`+low.map(row).join("")+`<h3>最近進出</h3>`+(aliveLog().slice(-5).reverse().map(logRow).join("")||`<div class="s lk">尚無紀錄</div>`)}
if(tab=="inv"){o=`<input placeholder="🔍 搜尋名稱、規格、編號、位置" value="${esc(q)}" oninput="q=this.value;list()"><div class="seg">${[["all","全部"],["切粒機","切粒機"],["押出機","押出機"],["其他","其他"],["pend","⏳待修"],["rep","🛠送修中"]].map(([k,v])=>`<button class="pill ${cat==k?"on":""}" onclick="cat='${k}';render()">${v}</button>`).join("")}</div><button class="btn ac" onclick="needA(()=>edit())">＋ 新增品項</button><div id="ls"></div>`}
if(tab=="log"){o=`<button class="btn ac" onclick="need(()=>move())">＋ 登記進貨／領用</button><h3>進出紀錄</h3>`+(aliveLog().slice().reverse().map(logRow).join("")||`<div class="lk">尚無紀錄</div>`)}
if(tab=="hist"){const ms=ALLM(),hs=(S.hist||[]).filter(x=>hm=="all"||x.machine==hm).sort((a,b)=>(b.date+b.t).localeCompare(a.date+a.t));o=`<button class="btn ac" onclick="need(()=>hEdit())">＋ 新增維修履歷</button><label>篩選機台</label><select onchange="hm=this.value;render()"><option value="all">全部機台</option>${ms.map(x=>`<option ${hm==x?"selected":""}>${x}</option>`).join("")}</select><div class="lk">共 ${hs.length} 筆${hm!="all"?"・"+esc(hm)+"：拆換 "+hs.filter(x=>x.action=="拆換").length+"・送修 "+hs.filter(x=>x.action=="送修").length+"・回裝 "+hs.filter(x=>x.action=="回裝").length:""}</div>`+(hs.map(hRow).join("")||`<div class="lk">尚無履歷</div>`)}
if(tab=="scrap"){const logs=scrapList();const months=[...new Set(logsAllScrap().map(scrapMonth).filter(Boolean))].sort().reverse();const items=S.items.filter(i=>(i.scrap||0)>0||logsAllScrap().some(l=>l.id==i.id));o=`<div class="two"><button class="btn ac" onclick="need(()=>scrapPick())">＋ 登記報廢</button><button class="btn" onclick="scrapCSV()">⬇ 匯出 CSV</button></div><div class="two"><div><label>月份</label><select onchange="sm=this.value;render()"><option value="all">全部月份</option>${months.map(x=>`<option value="${x}" ${sm==x?"selected":""}>${x}</option>`).join("")}</select></div><div><label>品項</label><select onchange="si=this.value;render()"><option value="all">全部品項</option>${items.map(i=>`<option value="${i.id}" ${si==i.id?"selected":""}>${esc(label(i))}</option>`).join("")}</select></div></div><div class="lk">共 ${logs.length} 筆${sm!="all"?"・"+esc(sm):""}${si!="all"?"・"+esc(label(find(si)||{name:si})):""}</div>`+(logs.slice().reverse().map(logRow).join("")||`<div class="lk">尚無報廢紀錄</div>`)}
if(tab=="set"){o=`<h3>主檔</h3><button class="btn" onclick="vendors()">🏭 進貨廠商管理（${(S.vendors||[]).length}）</button><h3>帳號</h3><div class="lk">目前：${esc(me()?.u)}（${RN[me()?.role]}）。管理員：全部權限；進貨管理：進出貨、廠商、進貨時新增品項；檢視者：只能瀏覽。<br>帳密存在本機瀏覽器（雜湊），屬前端簡易登入，非企業級資安。</div><button class="btn" onclick="chPw()">變更我的密碼</button>${isAdmin()?`<button class="btn" onclick="chPin()">管理帳號（新增／改密碼／刪除）</button>`:""}<button class="btn" onclick="logout()">登出</button><button class="btn" onclick="exp()">匯出備份 JSON</button>${isAdmin()?`<button class="btn dg" onclick="askReset()">⚠️ 重置為初始清單（清空數量與紀錄）</button>`:""}`}
o+=`<footer>內部備品管理，非正式 ERP・${window.WHC&&WHC.on?"資料雲端共用":"資料僅存在本機瀏覽器"}</footer>`;m.innerHTML=o;if(tab=="inv")list()}

function stockDelta(type,n,from){n=+n||0;const z={qty:0,floor:0,rep:0,pend:0,scrap:0};if(type=="in")return{...z,qty:n};if(type=="out")return{...z,qty:-n,floor:n};if(type=="use")return{...z,floor:-n};if(type=="wuse")return{...z,qty:-n};if(type=="ret")return{...z,qty:n,floor:-n};if(type=="rsend")return from=="floor"?{...z,floor:-n,rep:n}:from=="pend"?{...z,pend:-n,rep:n}:{...z,qty:-n,rep:n};if(type=="rback")return{...z,qty:n,rep:-n};if(type=="pend")return from=="floor"?{...z,floor:-n,pend:n}:{...z,qty:-n,pend:n};if(type=="pret")return from=="floor"?{...z,floor:n,pend:-n}:{...z,qty:n,pend:-n};if(type=="scrap")return from=="floor"?{...z,floor:-n,scrap:n}:from=="pend"?{...z,pend:-n,scrap:n}:from=="rep"?{...z,rep:-n,scrap:n}:{...z,qty:-n,scrap:n};if(type=="unscrap")return from=="floor"?{...z,floor:n,scrap:-n}:from=="pend"?{...z,pend:n,scrap:-n}:from=="rep"?{...z,rep:n,scrap:-n}:{...z,qty:n,scrap:-n};return z}
function negDelta(d){return{qty:-d.qty,floor:-d.floor,rep:-d.rep,pend:-(d.pend||0),scrap:-(d.scrap||0)}}
function previewStock(it,d){return{qty:(it.qty||0)+d.qty,floor:(it.floor||0)+d.floor,rep:(it.rep||0)+d.rep,pend:(it.pend||0)+(d.pend||0),scrap:(it.scrap||0)+(d.scrap||0)}}

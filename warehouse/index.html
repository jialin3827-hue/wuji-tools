<!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#121826"><title>花壇備品倉儲</title>
<style>
:root{--bg:#0b0f17;--p1:#121826;--p2:#1a2233;--ln:#263045;--tx:#e6edf3;--mu:#8b98ad;--ac:#f0b90b;--red:#f6465d;--grn:#0ecb81}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"PingFang TC","Noto Sans TC",sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--p1);border-bottom:1px solid var(--ln);padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;display:flex;align-items:center;gap:8px}
.logo{font-weight:800;color:var(--ac);font-size:17px}.sp{flex:1}
.pill{font-size:12px;padding:4px 10px;border-radius:12px;background:var(--p2);color:var(--mu);border:0}.pill.on{background:var(--ac);color:#0b0f17;font-weight:700}
main{padding:12px 12px calc(80px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--p1);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:12px 0;color:var(--mu);font-size:14px}nav button.on{color:var(--ac);font-weight:700}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.card{background:var(--p1);border:1px solid var(--ln);border-radius:12px;padding:12px}
.card .n{font-size:24px;font-weight:800;color:var(--ac)}.card .l{font-size:12px;color:var(--mu)}.card.warn .n{color:var(--red)}
h3{margin:16px 0 8px;font-size:15px}
.row{display:flex;align-items:center;gap:10px;background:var(--p1);border:1px solid var(--ln);border-radius:10px;padding:12px;margin:6px 0}
.row .t{flex:1;min-width:0}.row .s{font-size:12px;color:var(--mu)}.q{font-size:20px;font-weight:800;min-width:44px;text-align:right}.low{color:var(--red)}
input,select,textarea{width:100%;background:var(--p2);border:1px solid var(--ln);border-radius:10px;padding:11px;margin:4px 0 10px}
label{font-size:12px;color:var(--mu)}
.btn{border:0;border-radius:10px;padding:13px;font-weight:700;background:var(--p2);width:100%;margin:4px 0}.btn.ac{background:var(--ac);color:#0b0f17}.btn.in{background:var(--grn);color:#0b0f17}.btn.out{background:var(--red)}.btn.dg{background:#5a1a22}
.two{display:flex;gap:8px}.two>*{flex:1}
.seg{display:flex;gap:6px;margin-bottom:8px}.seg button{flex:1}
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;z-index:9}.modal.on{display:flex}
.sheet{background:var(--p1);width:100%;max-width:640px;margin:0 auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.lk{color:var(--mu);font-size:12px}footer{text-align:center;font-size:12px;color:var(--mu);margin-top:20px}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--ac);color:#000;padding:8px 14px;border-radius:10px;display:none;z-index:10;font-weight:700}
</style></head><body>
<header><span class="logo">📦 花壇備品倉儲</span><span class="sp"></span><button class="pill" id="lockBtn" onclick="logout()">登出</button></header>
<div id="lg" style="position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px"><div style="width:100%;max-width:360px"><div class="logo" style="font-size:24px;text-align:center">📦 花壇備品倉儲</div><div class="lk" style="text-align:center;margin:6px 0 18px">僅限授權人員登入</div><label>帳號</label><input id=lu autocomplete=username><label>密碼</label><input id=lp type=password autocomplete=current-password><button class="btn ac" id=lb>登入</button><div class="lk" style="text-align:center;margin-top:12px">內部備品管理，非正式 ERP・前端簡易登入，非企業級資安</div></div></div>
<main id="m"></main>
<nav><button data-t="home" class="on">總覽</button><button data-t="inv">庫存</button><button data-t="log">進出</button><button data-t="set">設定</button></nav>
<div class="modal" id="md" onclick="if(event.target==this)closeM()"><div class="sheet" id="sh"></div></div><div id="toast"></div>
<script src="config.js"></script><script src="cloud.js"></script><script>
const SEED={"切粒機":[["條紋鋼輪"],["切粒滾刀"],["固定刀"],["橡膠滾輪"],["皮帶","B-70"],["塑膠齒輪"],["培林","UCF205-16J;6206ZZCM;6208-ZZ/C3"],["切粒機變頻器"]],
"押出機":[["感測溫度線"],["電磁開關","SC-0;TR-ON/3;S-P11;S-P21;S-P30T;S-P35T;MSO-P11;SP40T;MSO-SP21"],["溫度控制面板"],["FUSE","3A"],["皮帶","B-80;C-103;C-108;C-110;C-130;C-135;C-145;C-148;SPA-1457;SPA-1432;5V-710"],["斷路器","NF-250-CN;NF-100-CN 3P 50A;BH 2P 20A"],["方型電熱片","220V 1700W 228x75;220V 1800W 228x75;220V 3000W 280x120;220V 3200W 280x120"],["圓形電熱片","220V 1850W 127x150;220V 1350W 126x110;220V 2050W 126x145;220V 2500W 126x175;220V 2050W 126x160;220V 1700W 126x180"],["押出機散熱風車"],["主馬達","60HP;75HP"],["變頻器","60HP;75HP"],["變頻器","Mitsubishi FR-D720-070-NA"],["可程式定時器"],["濾網","40x0.25 165mm;46x0.25 150mm"],["震動台馬達"],["泵浦","四川川嶺 E2020 60HZ 2HP 2P"],["交織式防電擊電焊機"],["熱壓封口機","110V"],["天車遙控器"],["抽屜開關"]],
"其他":[["螺絲組"],["潤滑油"],["清潔布"],["手套"],["膠帶"]]};
const CATN={"切粒機":"切粒機維修備品","押出機":"押出機維修備品","其他":"其他常用備品"};const PFX={"切粒機":"P","押出機":"E","其他":"O"};
const MACH={"切粒機":["A","B","C","D","E","F"].map(x=>x+" 號機"),"押出機":[1,2,3,4,5,6].map(x=>x+" 號機")};
function seed(){const a=[];for(const c in SEED){let i=0;SEED[c].forEach(([n,s])=>(s?s.split(";"):[""]).forEach(sp=>a.push({id:PFX[c]+String(++i).padStart(3,"0"),category:c,name:n,spec:sp,unit:"個",qty:0,floor:0,safety:1,location:"",note:""})))}return a}
const K="wuji-wh-v1";let S=JSON.parse(localStorage.getItem(K)||"null");
if(!S)S={items:seed(),log:[]};
const save=()=>{localStorage.setItem(K,JSON.stringify(S));window.WHC&&WHC.save()};
if(!S.items.some(i=>i.category=="其他")&&!S.v2)S.items.push(...seed().filter(i=>i.category=="其他"));S.v2=1;S.items.forEach(i=>{if(i.floor==null)i.floor=0});save();
async function h(p){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("wuji-wh:"+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
const DEFU={admin:{pw:"1127",role:"admin"},hyman:{pw:"27397449",role:"stock"},viewer:{pw:"0000",role:"viewer"},"999":{pw:"0000",role:"viewer"}};const RN={admin:"管理員",stock:"進貨管理",viewer:"檢視者"};let tab="home",cat="all",q="";
async function users(){if(!S.users){S.users={};for(const u in DEFU)S.users[u]={h:await h(u+":"+DEFU[u].pw),role:DEFU[u].role};save()}
 if((S.uv||0)<2){for(const u of["admin","hyman"])S.users[u]={h:await h(u+":"+DEFU[u].pw),role:DEFU[u].role};S.uv=2;save()}
 if(S.uv<3){S.users["999"]={h:await h("999:0000"),role:"viewer"};S.uv=3;save()}return S.users}
const me=()=>{const x=JSON.parse(sessionStorage.getItem("whS")||"null");return x&&x.exp>Date.now()&&S.users&&S.users[x.u]?x:null};
const unlocked=()=>["admin","stock"].includes(me()?.role);const isAdmin=()=>me()?.role=="admin";
function needA(fn){if(!isAdmin())return toast("僅限管理員");fn&&fn()}
function lockUI(){const x=me();lockBtn.textContent=x?(x.role=="viewer"?"👁 ":"🔓 ")+x.u+"｜登出":"登出";lockBtn.className="pill"+(unlocked()?" on":"")}
async function doLogin(){let U=await users();const u=lu.value.trim(),ph=await h(u+":"+lp.value);if(window.WHC&&WHC.on){try{await WHC.login(u,ph);U=S.users}catch(e){return toast(e.message=="auth"?"帳號或密碼錯誤":"雲端連線失敗")}}if(U[u]&&U[u].h===ph){sessionStorage.setItem("whS",JSON.stringify({u,role:U[u].role,exp:Date.now()+8*36e5}));lp.value="";gate()}else toast("帳號或密碼錯誤")}
function logout(){sessionStorage.removeItem("whS");closeM();gate()}
function gate(){const ok=!!me();lg.style.display=ok?"none":"flex";m.style.display=ok?"":"none";document.querySelector("nav").style.display=ok?"":"none";if(ok)render();else m.innerHTML=""}
function need(fn){if(!me())return gate();if(!unlocked())return toast("檢視者無此權限，請用管理員登入");fn&&fn()}
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tw=t=>new Date(t).toLocaleString("zh-TW",{timeZone:"Asia/Taipei",hour12:false});
const label=it=>it.name+(it.spec?" "+it.spec:"");
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.style.display="block";clearTimeout(e._t);e._t=setTimeout(()=>e.style.display="none",1600)}
function openM(x){sh.innerHTML=x;md.classList.add("on")}function closeM(){md.classList.remove("on")}
const row=it=>`<div class="row" onclick="detail('${it.id}')"><div class="t"><b>${esc(label(it))}</b><div class="s">${it.id}・${CATN[it.category]||esc(it.category)}${it.location?"・📍"+esc(it.location):""}</div></div><div class="q ${TOT(it)<=it.safety?"low":""}">${TOT(it)}<span class="s"> ${esc(it.unit)}</span><div class="s" style="font-size:11px">倉${it.qty}・場${it.floor||0}</div></div></div>`;
function render(){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t==tab));lockUI();mig();let o="";
if(tab=="home"){const low=S.items.filter(i=>TOT(i)<=i.safety);o=`<div class="cards"><div class="card"><div class="n">${S.items.length}</div><div class="l">品項數</div></div><div class="card"><div class="n">${S.items.reduce((a,i)=>a+TOT(i),0)}</div><div class="l">總庫存數</div><div class="s" style="font-size:11px">倉 ${S.items.reduce((a,i)=>a+i.qty,0)}・現場 ${S.items.reduce((a,i)=>a+(i.floor||0),0)}</div></div><div class="card warn"><div class="n">${low.length}</div><div class="l">低於最低庫存</div></div></div>`+(low.length?`<div class="row" style="border-color:var(--red);background:#2a1218" onclick="window.scrollTo(0,9e3)"><div class="t"><b style="color:var(--red)">🛒 提醒採購：${low.length} 項已達最低庫存</b><div class="s">採購人員請依下方清單補貨</div></div></div>`:"");
 for(const c in CATN){const it=S.items.filter(i=>i.category==c);o+=`<div class="row" onclick="cat='${c}';tab='inv';render()"><div class="t"><b>${CATN[c]}</b><div class="s">${it.length} 項・待採購 ${it.filter(i=>TOT(i)<=i.safety).length}</div></div><div class="q">›</div></div>`}
 o+=`<h3>最近進出</h3>`+(S.log.slice(-5).reverse().map(logRow).join("")||`<div class="s lk">尚無紀錄</div>`)+`<h3>🛒 待採購清單（總庫存 ≤ 最低庫存）</h3>`+low.map(row).join("")}
if(tab=="inv"){o=`<input placeholder="🔍 搜尋名稱、規格、編號、位置" value="${esc(q)}" oninput="q=this.value;list()"><div class="seg">${[["all","全部"],["切粒機","切粒機"],["押出機","押出機"],["其他","其他"]].map(([k,v])=>`<button class="pill ${cat==k?"on":""}" onclick="cat='${k}';render()">${v}</button>`).join("")}</div><button class="btn ac" onclick="needA(()=>edit())">＋ 新增品項</button><div id="ls"></div>`}
if(tab=="log"){o=`<button class="btn ac" onclick="need(()=>move())">＋ 進貨／出貨登記</button><h3>進出紀錄</h3>`+(S.log.slice().reverse().map(logRow).join("")||`<div class="lk">尚無紀錄</div>`)}
if(tab=="set"){o=`<h3>主檔</h3><button class="btn" onclick="vendors()">🏭 進貨廠商管理（${(S.vendors||[]).length}）</button><h3>帳號</h3><div class="lk">目前：${esc(me()?.u)}（${RN[me()?.role]}）。管理員：全部權限；進貨管理：進出貨、廠商、進貨時新增品項；檢視者：只能瀏覽。<br>帳密存在本機瀏覽器（雜湊），屬前端簡易登入，非企業級資安。</div><button class="btn" onclick="chPw()">變更我的密碼</button>${isAdmin()?`<button class="btn" onclick="chPin()">管理帳號（新增／改密碼／刪除）</button>`:""}<button class="btn" onclick="logout()">登出</button><button class="btn" onclick="exp()">匯出備份 JSON</button><button class="btn dg" onclick="needA(reset)">⚠️ 重置為初始清單（清空數量與紀錄）</button>`}
o+=`<footer>內部備品管理，非正式 ERP・資料僅存在本機瀏覽器</footer>`;m.innerHTML=o;if(tab=="inv")list()}
function list(){const k=q.trim().toLowerCase();ls.innerHTML=S.items.filter(i=>(cat=="all"||i.category==cat)&&(!k||[i.id,i.name,i.spec,i.location,i.note].join(" ").toLowerCase().includes(k))).map(row).join("")||`<div class="lk">找不到</div>`}
const logRow=l=>`<div class="row"><div class="t"><b>${l.type=="in"?"🟢 進":l.type=="out"?"🔴 領用→現場":l.type=="use"?"🔧 現場耗用":l.type=="ret"?"↩ 退回倉庫":"✏️"} ${esc(l.label)}</b><div class="s">📅 ${esc(l.date||tw(l.t).split(" ")[0])}${l.vendor?"・廠商："+esc(l.vendor):""}${l.taker?"・領取："+esc(l.taker):""}${l.machine?"・機台："+esc(l.machine):""}・登記：${esc(l.who)}${l.note?"<br>備註："+esc(l.note):""}</div></div><div class="q">${l.type=="in"?"+":l.type=="out"||l.type=="use"?"-":l.type=="ret"?"↩":""}${l.n??""}</div></div>`;
const TOT=i=>i.qty+(i.floor||0),LOWI=i=>TOT(i)<=i.safety;function mig(){(S.items||[]).forEach(i=>{if(i.floor==null)i.floor=0})}
const find=id=>S.items.find(i=>i.id==id);
function addLog(type,it,n,note,x={}){S.log.push({t:Date.now(),type,id:it.id,label:label(it),n,note,who:me()?.u||"管理員",...x});if(S.log.length>2000)S.log.shift();save()}
function detail(id){const it=find(id);openM(`<h3>${esc(label(it))}</h3><div class="lk">${it.id}・${CATN[it.category]||esc(it.category)}</div><div class="cards" style="margin:12px 0"><div class="card"><div class="n">${it.qty}</div><div class="l">倉庫</div></div><div class="card"><div class="n">${it.floor||0}</div><div class="l">現場</div></div><div class="card"><div class="n ${TOT(it)<=it.safety?"low":""}">${TOT(it)}</div><div class="l">總庫存(${esc(it.unit)})</div></div><div class="card"><div class="n">${it.safety}</div><div class="l">最低庫存</div></div><div class="card"><div class="n" style="font-size:14px">${esc(it.location)||"—"}</div><div class="l">位置</div></div></div>${it.note?`<div class="lk">備註：${esc(it.note)}</div>`:""}
<div class="two"><button class="btn in" onclick="need(()=>move('${id}','in'))">＋ 進貨</button><button class="btn out" onclick="need(()=>move('${id}','out'))">－ 領用到現場</button></div><div class="two"><button class="btn" onclick="need(()=>move('${id}','use'))">🔧 現場耗用</button><button class="btn" onclick="need(()=>move('${id}','ret'))">↩ 退回倉庫</button></div><button class="btn" onclick="needA(()=>edit('${id}'))">✏️ 編輯</button><button class="btn dg" onclick="needA(()=>del('${id}'))">🗑 刪除</button>`)}
const today=()=>new Date().toLocaleDateString("sv-SE",{timeZone:"Asia/Taipei"});
function move(id,type="in"){window.mt=type;const c0=id?find(id).category:(cat!="all"?cat:"切粒機");
 openM(`<h3>進貨／領用／耗用登記</h3><div class="seg"><button class="btn" id=bi onclick="setT('in')">＋ 進貨</button><button class="btn" id=bo onclick="setT('out')">－ 領用到現場</button></div><div class="seg"><button class="btn" id=bu onclick="setT('use')">🔧 現場耗用</button><button class="btn" id=br onclick="setT('ret')">↩ 退回倉庫</button></div>
<label>大項目</label><select id=mc onchange="fillItems()">${Object.keys(CATN).map(c=>`<option value="${c}" ${c==c0?"selected":""}>${CATN[c]}</option>`).join("")}</select>
<label>小項目</label><select id=mi onchange="itemChg()"></select><div id=ni style="display:none;border:1px dashed var(--ac);border-radius:10px;padding:10px;margin-bottom:10px"><label>新品項名稱 *（將加入上方大項目）</label><input id=nn><label>規格（選填）</label><input id=nsp></div>
<div id=vx></div><div class="two"><div><label>進出貨日期</label><input id=md2 type=date value="${today()}"></div><div><label>數量</label><input id=mn type=number inputmode=numeric min=1 value=1></div></div><div id=ox></div><label>備註</label><textarea id=mo rows=2 placeholder="例：更換原因、單號"></textarea><button class="btn ac" onclick="doMove()">確認登記</button>`);fillItems(id);setT(type)}
function fillItems(sel){const v=sel||mi.value;mi.innerHTML=S.items.filter(i=>i.category==mc.value).map(i=>`<option value="${i.id}" ${i.id==v?"selected":""}>${esc(label(i))}（倉 ${i.qty}・場 ${i.floor||0}）</option>`).join("")+(mt=="in"?`<option value="__new">＋ 新增品項…</option>`:"");itemChg()}
function itemChg(){ni.style.display=mi.value=="__new"?"":"none";if(mt!="in")setOx()}
function vendOpts(v){return `<option value="">請選擇廠商</option>`+(S.vendors||[]).map(x=>`<option value="${x.id}" ${x.id==v?"selected":""}>${esc(x.name)}${x.tel?"（"+esc(x.tel)+"）":""}</option>`).join("")+`<option value="__new">＋ 新增廠商…</option>`}
function vendChg(){nv.style.display=mv.value=="__new"?"":"none"}
function setT(t){mt=t;bi.className="btn"+(t=="in"?" in":"");bo.className="btn"+(t=="out"?" out":"");bu.className="btn"+(t=="use"?" out":"");br.className="btn"+(t=="ret"?" in":"");
 vx.innerHTML=t=="in"?`<label>進貨廠商 *</label><select id=mv onchange="vendChg()">${vendOpts()}</select><div id=nv style="display:none;border:1px dashed var(--ac);border-radius:10px;padding:10px;margin-bottom:10px"><label>廠商名稱 *</label><input id=nvn><label>聯絡電話</label><input id=nvt type=tel><label>廠商備註</label><input id=nvo></div>`:"";fillItems();setOx()}
function setOx(){const ms=MACH[mc.value];ox.innerHTML=mt!="in"?`<label>${mt=="out"?"領取人員":mt=="use"?"使用人員":"退回人員"} *</label><input id=mp placeholder="姓名"><label>使用機台${ms?" *":"（選填）"}</label>${ms?`<select id=mm><option value="">請選擇</option>${ms.map(x=>`<option>${x}</option>`).join("")}</select>`:`<input id=mm placeholder="無則留空 (N/A)">`}`:""}
function newId(c){const p=PFX[c]||"O";return p+String(Math.max(0,...S.items.filter(i=>i.id[0]==p).map(i=>+i.id.slice(1)))+1).padStart(3,"0")}
function doMove(){if(!unlocked())return need();const n=parseInt(mn.value);if(!(n>0))return toast("數量錯誤");if(!md2.value)return toast("請選日期");let it,who="",mc2="",vd=null;
 if(mt=="in"){if(!mv.value)return toast("請選進貨廠商");if(mv.value=="__new"){const nm=nvn.value.trim();if(!nm)return toast("請填廠商名稱");if((S.vendors||[]).some(x=>x.name==nm))return toast("廠商已存在，請直接選擇")}
  if(mi.value=="__new"){const nm=nn.value.trim();if(!nm)return toast("請填新品項名稱");if(S.items.some(i=>i.category==mc.value&&i.name==nm&&i.spec==nsp.value.trim()))return toast("品項已存在，請直接選擇")}
  if(mv.value=="__new"){vd={id:"V"+Date.now(),name:nvn.value.trim(),tel:nvt.value.trim(),note:nvo.value.trim()};(S.vendors=S.vendors||[]).push(vd)}else vd=S.vendors.find(x=>x.id==mv.value);
  if(mi.value=="__new"){it={id:newId(mc.value),category:mc.value,name:nn.value.trim(),spec:nsp.value.trim(),unit:"個",qty:0,floor:0,safety:1,location:"",note:""};S.items.push(it);addLog("edit",it,null,"新增（進貨時）")}else it=find(mi.value)}
 else{it=find(mi.value);if(!it)return toast("請選品項");who=mp.value.trim();mc2=mm.value.trim();if(!who)return toast("請填領取人員");if(MACH[it.category]&&!mc2)return toast("請選使用機台");if(mt=="out"&&n>it.qty)return toast("倉庫數量不足（倉 "+it.qty+"）");if(mt!="out"&&n>(it.floor||0))return toast("現場數量不足（場 "+(it.floor||0)+"）")}
 if(mt=="in")it.qty+=n;else if(mt=="out"){it.qty-=n;it.floor=(it.floor||0)+n}else if(mt=="use")it.floor-=n;else{it.floor-=n;it.qty+=n}addLog(mt,it,n,mo.value.trim(),{date:md2.value,taker:who,machine:mc2||(mt!="in"?"N/A":""),vendor:vd?vd.name:""});closeM();toast("已登記");render()}
function vendors(){const ad=unlocked();openM(`<h3>🏭 進貨廠商</h3>${(S.vendors||[]).map(v=>`<div class="row"><div class="t"><b>${esc(v.name)}</b><div class="s">${v.tel?"☎ "+esc(v.tel):"無電話"}${v.note?"・"+esc(v.note):""}</div></div>${ad?`<button class="pill" onclick="vEdit('${v.id}')">編輯</button><button class="pill" onclick="vDel('${v.id}')">刪除</button>`:""}</div>`).join("")||`<div class="lk">尚無廠商</div>`}${ad?`<button class="btn ac" onclick="vEdit()">＋ 新增廠商</button>`:`<div class="lk">檢視者僅能瀏覽</div>`}`)}
function vEdit(id){need(()=>{const v=id?S.vendors.find(x=>x.id==id):{name:"",tel:"",note:""};openM(`<h3>${id?"編輯":"新增"}廠商</h3><label>廠商名稱 *</label><input id=vn value="${esc(v.name)}"><label>聯絡電話</label><input id=vt type=tel value="${esc(v.tel)}"><label>備註</label><textarea id=vo rows=2>${esc(v.note)}</textarea><button class="btn ac" onclick="vSave('${id||""}')">儲存</button><button class="btn" onclick="vendors()">返回</button>`)})}
function vSave(id){if(!unlocked())return;const nm=vn.value.trim();if(!nm)return toast("請填廠商名稱");S.vendors=S.vendors||[];if(S.vendors.some(x=>x.name==nm&&x.id!=id))return toast("名稱重複");let v=id&&S.vendors.find(x=>x.id==id);if(!v){v={id:"V"+Date.now()};S.vendors.push(v)}Object.assign(v,{name:nm,tel:vt.value.trim(),note:vo.value.trim()});save();toast("已儲存");vendors()}
function vDel(id){need(()=>{const v=S.vendors.find(x=>x.id==id);if(confirm("刪除廠商「"+v.name+"」？（過去紀錄保留名稱）")){S.vendors=S.vendors.filter(x=>x.id!=id);save();vendors()}})}
function edit(id){const it=id?find(id):{category:cat=="押出機"?"押出機":"切粒機",name:"",spec:"",unit:"個",qty:0,floor:0,safety:1,location:"",note:""};const f=(k,l,t="text")=>`<label>${l}</label><input id=f_${k} type=${t} value="${esc(it[k])}">`;
 openM(`<h3>${id?"編輯":"新增"}品項</h3><label>分類</label><select id=f_category>${Object.keys(CATN).map(c=>`<option value="${c}" ${it.category==c?"selected":""}>${CATN[c]}</option>`).join("")}</select>${f("name","名稱")}${f("spec","規格")}${f("unit","單位")}${id?"":f("qty","倉庫數量","number")}${f("floor","現場數量","number")}${f("safety","最低庫存","number")}${f("location","位置")}${f("note","備註")}<button class="btn ac" onclick="saveEdit('${id||""}')">儲存</button>`)}
function saveEdit(id){if(!isAdmin())return need();const g=k=>document.getElementById("f_"+k).value.trim();if(!g("name"))return toast("請填名稱");let it=id&&find(id);
 if(!it){const c=g("category"),p=PFX[c]||"O",mx=Math.max(0,...S.items.filter(i=>i.id[0]==p).map(i=>+i.id.slice(1)));it={id:p+String(mx+1).padStart(3,"0"),qty:Math.max(0,parseInt(g("qty"))||0),floor:Math.max(0,parseInt(g("floor"))||0)};S.items.push(it)}
 Object.assign(it,{category:g("category"),name:g("name"),spec:g("spec"),unit:g("unit")||"個",safety:Math.max(0,parseInt(g("safety"))||0),location:g("location"),note:g("note")});addLog("edit",it,null,id?"修改":"新增");closeM();toast("已儲存");render()}
function del(id){const it=find(id);if(!confirm("確定刪除「"+label(it)+"」？"))return;S.items=S.items.filter(i=>i.id!=id);addLog("edit",it,null,"刪除");closeM();toast("已刪除");render()}
function chPw(){openM(`<h3>變更我的密碼</h3><label>新密碼（至少 4 碼）</label><input id=np type=password><button class="btn ac" id=npok>儲存</button>`);npok.onclick=async()=>{if(np.value.length<4)return toast("至少 4 碼");const u=me().u;S.users[u].h=await h(u+":"+np.value);save();closeM();toast("密碼已更新")}}
function chPin(){needA(()=>{openM(`<h3>管理帳號</h3>${Object.entries(S.users).map(([u,x])=>`<div class="row"><div class="t"><b>${esc(u)}</b><div class="s">${RN[x.role]||x.role}</div></div>${u!=me().u?`<button class="pill" onclick="delU('${esc(u)}')">刪除</button>`:""}</div>`).join("")}<h3>新增／重設帳號</h3><label>帳號</label><input id=nu><label>密碼（至少 4 碼）</label><input id=np type=password><label>角色</label><select id=nr><option value=viewer>檢視者（只讀）</option><option value=stock>進貨管理</option><option value=admin>管理員</option></select><button class="btn ac" id=nok>儲存</button>`);nok.onclick=async()=>{const u=nu.value.trim();if(!/^[\w.-]{2,20}$/.test(u))return toast("帳號 2-20 英數");if(np.value.length<4)return toast("密碼至少 4 碼");S.users[u]={h:await h(u+":"+np.value),role:nr.value};save();toast("已儲存");chPin()}})}
function delU(u){if(confirm("刪除帳號 "+u+"？")){delete S.users[u];save();chPin()}}
function reset(){if(!confirm("會清空所有數量、紀錄與自訂品項，確定？"))return;S={items:seed(),log:[],users:S.users,vendors:S.vendors,v2:1,uv:S.uv};save();toast("已重置");render()}

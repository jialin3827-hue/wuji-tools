name: Update TW stock data
on:
  schedule:
    - cron: '30 6 * * 1-5'   # 14:30 Asia/Taipei
    - cron: '0 13 * * 1-5'   # 21:00 Asia/Taipei
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: update-data, cancel-in-progress: false }
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Fetch TWSE / TPEx open data (keeps previous JSON on failure)
        run: python3 scripts/fetch_tw.py || echo "fetch failed, keeping previous data"
      - name: Commit if changed
        run: |
          git config user.name "wuji-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add budget/data
          git diff --cached --quiet || (git commit -m "data: update $(TZ=Asia/Taipei date +%F_%H%M)" && git push)

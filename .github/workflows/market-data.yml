name: Update market game data
on:
  schedule:
    - cron: '45 6 * * 1-5'    # 14:45 Asia/Taipei, after TW close -> TW bars
    - cron: '30 22 * * 1-5'   # 06:30 Asia/Taipei Tue-Sat, after US close -> US bars
  workflow_dispatch:
    inputs:
      which: { description: 'tw | us | all', default: 'all' }
permissions:
  contents: write
concurrency: { group: market-data, cancel-in-progress: false }
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Fetch (keeps previous JSON on failure)
        run: |
          W="${{ github.event.inputs.which }}"
          if [ -z "$W" ]; then
            if [ "${{ github.event.schedule }}" = "30 22 * * 1-5" ]; then W=us; else W=tw; fi
          fi
          python3 scripts/fetch_market.py "$W" || echo "fetch failed, keeping previous data"
      - name: Commit if changed
        run: |
          git config user.name "wuji-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market/data
          git diff --cached --quiet && exit 0
          git commit -m "market data: $(TZ=Asia/Taipei date +%F_%H%M)"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done

name: Update market game data
on:
  schedule:
    - cron: '45 6 * * 1-5'    # 14:45 Asia/Taipei, after TW close -> TW bars
    - cron: '30 22 * * 1-5'   # 06:30 Asia/Taipei Tue-Sat, after US close -> US bars
    - cron: '10 1-23/3 * * *' # every 3h: time-boxed history backfill / rolling refresh for all symbols
  workflow_dispatch:
    inputs:
      which: { description: 'tw | us | all | backfill', default: 'all' }
permissions:
  contents: write
concurrency: { group: market-data, cancel-in-progress: false }
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-openbb.txt
      - name: Fetch (keeps previous JSON on failure)
        run: |
          W="${{ github.event.inputs.which }}"
          if [ -z "$W" ]; then
            case "${{ github.event.schedule }}" in "30 22 * * 1-5") W=us;; "10 1-23/3 * * *") W=backfill;; *) W=tw;; esac
          fi
          TW_BF_SECONDS=900 US_BF_SECONDS=1500 python3 scripts/fetch_market.py "$W" || echo "fetch failed, keeping previous data"
          echo "W=$W" >> "$GITHUB_ENV"
      - name: Install OpenBB backup (optional)
        id: obb
        if: env.W != 'backfill'
        continue-on-error: true
        timeout-minutes: 8
        run: pip install -q -r scripts/requirements-openbb.txt
      - name: OpenBB backup for missing/stale tickers (optional)
        if: steps.obb.outcome == 'success' && env.W != 'backfill'
        continue-on-error: true
        timeout-minutes: 8
        run: python3 scripts/fallback_openbb.py "$W" || echo "openbb fallback failed, keeping primary data"
      - name: Commit if changed
        run: |
          git config user.name "wuji-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market/data
          git diff --cached --quiet && exit 0
          git commit -m "market data: $(TZ=Asia/Taipei date +%F_%H%M)"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done

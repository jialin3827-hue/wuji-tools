<!doctype html>
<html lang="zh-Hant-TW"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0f17">
<title>大亨大樓 3D｜舞吉股市大亨</title>
<style>
:root{--bg:#0b0f17;--p1:rgba(18,24,38,.72);--ln:rgba(255,255,255,.12);--tx:#f2f5f9;--mu:#a7b3c6;--ac:#f0b90b}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,"PingFang TC","Noto Sans TC",sans-serif;-webkit-tap-highlight-color:transparent;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.glass{background:var(--p1);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--ln);border-radius:16px}
#top{position:fixed;left:10px;right:10px;top:calc(env(safe-area-inset-top) + 10px);padding:10px 14px;display:flex;gap:10px;align-items:center}
#top a{color:var(--tx);text-decoration:none;font-size:20px;line-height:1}
.ttl{font-weight:800;color:var(--ac);font-size:15px}.ttl small{color:var(--mu);font-weight:500;font-size:11px;margin-left:4px}
.sp{flex:1}.chip{font-size:11px;padding:3px 8px;border-radius:10px;background:rgba(255,255,255,.1);color:var(--mu);white-space:nowrap}
#card{position:fixed;left:10px;top:calc(env(safe-area-inset-top) + 66px);padding:10px 14px;min-width:190px;max-width:62%}
#rank{font-size:18px;font-weight:800}#rank i{font-style:normal;margin-right:4px}
#val{font-size:20px;font-weight:800;color:var(--ac);font-variant-numeric:tabular-nums;margin-top:2px}
#meta{font-size:11px;color:var(--mu);margin-top:2px}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.12);margin-top:7px;overflow:hidden}.bar b{display:block;height:100%;width:0;background:linear-gradient(90deg,#f0b90b,#ffe58a);border-radius:3px;transition:width .3s}
#bot{position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 10px);padding:10px 12px}
.row{display:flex;gap:8px;align-items:center}.row+.row{margin-top:8px}
.seg{display:flex;background:rgba(0,0,0,.25);border:1px solid var(--ln);border-radius:9px;overflow:hidden}
.seg button{border:0;background:none;color:var(--mu);padding:6px 10px;font:inherit;font-size:12px;cursor:pointer}.seg button.on{background:rgba(240,185,11,.2);color:var(--ac);font-weight:700}
input[type=range]{flex:1;accent-color:var(--ac)}
.btn{border:1px solid var(--ac);background:none;color:var(--ac);border-radius:9px;padding:5px 10px;font:inherit;font-size:12px;cursor:pointer;white-space:nowrap}
.note{font-size:10px;color:var(--mu);margin-top:6px;text-align:center}
#toast{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(.8);opacity:0;pointer-events:none;padding:12px 20px;font-size:17px;font-weight:800;color:#1b1300;background:linear-gradient(135deg,#ffe58a,#f0b90b);border-radius:14px;box-shadow:0 8px 30px rgba(240,185,11,.45);transition:.35s}
#toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;color:var(--mu)}
body.noui .glass,body.noui #toast{display:none}
</style></head>
<body>
<canvas id="c"></canvas>
<div id="top" class="glass"><a href="./" aria-label="返回">‹</a><div class="ttl">大亨大樓<small>3D 試玩版</small></div><div class="sp"></div><span class="chip" id="src">示範模式</span></div>
<div id="card" class="glass"><div id="rank"><i>🏪</i>街角小店</div><div id="val">NT$ 100,000</div><div id="meta">3 層樓</div><div class="bar"><b id="prog"></b></div><div id="meta2" style="font-size:10px;color:var(--mu);margin-top:4px"></div></div>
<div id="bot" class="glass">
 <div class="row" id="acctRow" style="display:none"><div class="seg" id="acct"><button data-a="tw">台股帳戶</button><button data-a="us">美股帳戶</button><button data-a="demo">示範</button></div></div>
 <div class="row" id="demoRow"><span class="chip">存款 10萬</span><input id="sl" type="range" min="0" max="1000" value="0"><span class="chip">富家 1000萬</span></div>
 <div class="row"><div class="seg" id="tod"><button data-t="auto" class="on">日夜循環</button><button data-t="day">白天</button><button data-t="dusk">黃昏</button><button data-t="night">夜晚</button></div><div class="sp"></div><button class="btn" id="play">▶ 成長示範</button></div>
 <div class="note">拖曳旋轉、雙指縮放｜虛擬幣模擬遊戲，非投資建議</div>
</div>
<div id="toast"></div>
<div id="err">這台裝置不支援 3D 顯示（WebGL）。<br>請改用較新的瀏覽器開啟。</div>
<script type="importmap">{"imports":{"three":"./vendor/three/three.module.min.js"}}</script>
<script type="module" src="./tower3d.js"></script>
</body></html>

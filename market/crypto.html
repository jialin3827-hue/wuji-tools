@keyframes halo{from{transform:translate3d(0,0,0);opacity:.8}to{transform:translate3d(-3%,5%,0);opacity:1}}
header>*{position:relative;z-index:1}
header a{color:#fff!important;border-color:rgba(34,211,238,.35)!important;border-radius:999px;padding:4px 10px!important}

.kv{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}.kv b{display:block;font-size:15px;color:var(--tx);font-family:var(--mono);font-variant-numeric:tabular-nums}.kv small{color:var(--mu);font-size:11px}
.cv{position:relative;overflow:hidden;width:100%;background:#fff;border-radius:0 0 16px 16px}.cv>canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.ob{width:100%;border-collapse:collapse;font-size:12px;font-family:var(--mono);font-variant-numeric:tabular-nums}.ob td{padding:3px 8px;text-align:right;border-bottom:1px solid var(--ln)}.ob td:first-child{text-align:left}
.ob tr.f{animation:fl .4s}@keyframes fl{0%{background:rgba(34,211,238,.16)}100%{background:transparent}}
.mid{font-size:14px;text-align:center;padding:6px;border-block:1px solid var(--ln);color:var(--tx);background:#F0FBFF;font-weight:800;font-family:var(--mono)}
#list input,.amt{width:100%;background:#F0FBFF;border:1px solid var(--ln);color:var(--tx);padding:8px 10px;font:inherit;outline:none;font-size:13px;border-radius:10px}
#list input:focus,.amt:focus{border-color:var(--cy);box-shadow:0 0 0 3px rgba(34,211,238,.2),0 0 12px rgba(34,211,238,.16)}
#coins{max-height:220px;overflow:auto;margin-top:8px}.cr{display:flex;justify-content:space-between;padding:8px 6px;border-bottom:1px solid var(--ln);cursor:pointer;font-size:13px;border-radius:8px;transition:background .15s}.cr:hover,.cr.on{background:#ECFEFF}.cr>span:last-child{font-family:var(--mono)}
.tape{height:160px;overflow:hidden;font-size:12px;font-family:var(--mono)}.tape div{display:grid;grid-template-columns:64px 48px 1fr 1fr;padding:4px 10px;border-bottom:1px solid var(--ln)}
.spk{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:0 10px 16px}
.spk .pn .bd{padding:6px 10px}.spk b{font-size:13px}
.wide{grid-column:1/-1}.note{color:var(--mu);font-size:11px;line-height:1.6}
.tbtn{display:flex;gap:8px;margin-top:8px}.tbtn button{flex:1;padding:10px;border:0;border-radius:12px;font:inherit;font-weight:800;cursor:pointer;font-size:14px;transition:transform .15s,box-shadow .15s}
.buy{color:#fff;background:var(--r);box-shadow:0 8px 18px rgba(225,29,72,.25),0 0 12px rgba(225,29,72,.25)}.sell{color:#fff;background:var(--g);box-shadow:0 8px 18px rgba(5,150,105,.25),0 0 12px rgba(5,150,105,.25)}
.tbtn button:hover{transform:translateY(-1px)}.tbtn button:active{transform:scale(.98)}
.flick{animation:flick .18s ease}@keyframes flick{0%{transform:scale(1.04)}100%{transform:none}}
#toast{border-radius:16px;background:#12203A!important;color:#fff;border:0!important;box-shadow:0 8px 28px rgba(30,40,90,.18),0 0 16px rgba(34,211,238,.2)}
@media(max-width:900px){.grid{grid-template-columns:1fr}.spk{grid-template-columns:1fr 1fr}.big{font-size:28px}header{flex-wrap:wrap}.clock{font-size:13px}}
@media(max-width:520px){.grid{gap:8px;padding:8px}.ob td{padding:3px 6px}.tape{height:140px}}
@media(hover:hover){.cr:hover{transform:translateX(2px)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}header::after{animation:none!important}}
html,body{overflow-x:hidden;max-width:100%}
</style></head><body>
<header><a href="./" style="color:var(--cy);text-decoration:none;border:1px solid var(--ln);padding:1px 6px">← 股市</a><span class="logo">舞吉・虛擬幣</span><span class="tag">模擬帳戶</span><span class="live" id="live">LIVE</span><span class="stat" id="src">BOOT</span><span class="sp"></span><span id="utc" class="utc"></span><span class="clock" id="clk"></span></header>
<div class="mq"><div id="mq"></div></div>
<div class="grid">
 <div class="pn"><h3>帳戶總資產<em id="acctn">美股帳戶現金＋虛擬幣</em></h3><div class="bd">
  <div class="big" id="eq">—</div><div id="pnl">—</div>
  <div class="kv"><div><small>可用現金 USD</small><b id="cash">—</b></div><div><small>虛擬幣市值</small><b id="cmv">—</b></div><div><small>已實現損益</small><b id="real">—</b></div></div>
  <div style="margin-top:8px;display:flex;gap:6px;align-items:center"><b id="tsym" style="color:var(--ac);min-width:52px">BTC</b><input id="amt" type="number" min="0" step="any" placeholder="買：金額 USD／賣：數量" class="amt" style="flex:1;min-width:0"></div>
  <div class="tbtn"><button class="buy" id="bb">買進</button><button class="sell" id="sb">賣出</button></div>
  <div id="hold" style="margin-top:6px;font-size:11px"></div>
  <div class="note" style="margin-top:6px">使用美股帳戶可用現金（USD）買賣，手續費 0.1%，依最新報價成交。點下方清單切換交易標的。</div></div></div>
 <div class="pn"><h3><span id="kt">BTC/USDT・1 分 K</span><em id="kp">—</em></h3><div class="cv" style="height:260px"><canvas id="kc"></canvas></div></div>
 <div class="pn"><h3>買賣盤<em id="obs">BTC</em></h3><table class="ob" id="asks"></table><div class="mid" id="midp">—</div><table class="ob" id="bids"></table></div>
 <div class="pn" id="list"><h3>前 20 大幣種<em>24h</em></h3><div class="bd"><input id="q" placeholder="搜尋幣種（例：ETH、索拉納）"><div id="coins"></div></div></div>
 <div class="pn"><h3>全市場資金流向<em>節點＝幣種</em></h3><div class="cv" style="height:300px"><canvas id="net" style="cursor:pointer"></canvas><div id="tip" style="position:absolute;display:none;pointer-events:none;background:#ffffffee;border:1px solid var(--ln);border-radius:10px;padding:6px 8px;font-size:12px;white-space:nowrap;box-shadow:0 8px 20px rgba(70,80,180,.14);color:var(--tx)"></div></div></div>
 <div class="pn"><h3>成交紀錄<em>BTC</em></h3><div class="tape" id="tape"></div></div>
</div>
<div class="spk" id="spk"></div>
<div id="toast" style="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1A1F3C;border:0;border-radius:16px;color:#fff;padding:8px 14px;opacity:0;transition:opacity .3s;z-index:9"></div>
<script src="i18n.js?v=29"></script><script src="store.js?v=29"></script>
<script>
let S=null;
const TOP=[["BTC","比特幣"],["ETH","以太幣"],["BNB","幣安幣"],["SOL","索拉納"],["XRP","瑞波幣"],["DOGE","狗狗幣"],["ADA","艾達幣"],["TRX","波場"],["AVAX","雪崩"],["LINK","Chainlink"],["DOT","波卡"],["TON","TON"],["SHIB","柴犬幣"],["LTC","萊特幣"],["BCH","比特現金"],["NEAR","NEAR"],["UNI","Uniswap"],["APT","Aptos"],["SUI","Sui"],["XLM","恆星幣"]];
const BN=TOP.slice();TOP.push(["GTR","GETTR幣"]);const DEX={GTR:{chain:'solana',ca:'CatEvkKVmK2fsiVJZ3EzEBuCW8bmNoHKxsXvbBggdebp'}};
const T={GTR:{p:0,c:0,v:1,dex:1}};let KL=[],KG=[],sel="BTC",live=false,gtrOK=false;
/* GTR：DexScreener 免費 API，每 10 秒；挑 GTR 為 baseToken 且流動性最高的交易對，否則用 quote 端換算 */
async function dexPoll(){try{const d=DEX.GTR,j=await (await fetch('https://api.dexscreener.com/tokens/v1/'+d.chain+'/'+d.ca)).json();
 const liq=p=>+(p.liquidity&&p.liquidity.usd)||0,base=j.filter(p=>p.baseToken.address===d.ca).sort((a,b)=>liq(b)-liq(a))[0];let px,pair;
 if(base){pair=base;px=+base.priceUsd;}else{pair=j.filter(p=>p.quoteToken.address===d.ca).sort((a,b)=>liq(b)-liq(a))[0];if(!pair)throw 0;px=(+pair.priceUsd)/(+pair.priceNative);}
 if(!(px>0))throw 0;T.GTR={p:px,c:+(pair.priceChange&&pair.priceChange.h24)||0,v:+(pair.volume&&pair.volume.h24)||1,dex:1,liq:liq(pair),pair:pair.pairAddress,base:!!base};gtrOK=true;
 const now=Math.floor(Date.now()/60000);const b=KG[KG.length-1];if(b&&b.t===now){b.c=px;b.h=Math.max(b.h,px);b.l=Math.min(b.l,px);}else if(KG.length){KG.push({t:now,o:b.c,h:Math.max(b.c,px),l:Math.min(b.c,px),c:px});if(KG.length>80)KG.shift();}
 if(!KG.length||Date.now()-(dexPoll.oh||0)>60000){dexPoll.oh=Date.now();gtrOHLC(pair.pairAddress);}
}catch(e){gtrOK=false;}}
async function gtrOHLC(pool){try{const j=await (await fetch('https://api.geckoterminal.com/api/v2/networks/solana/pools/'+pool+'/ohlcv/minute?aggregate=1&limit=80&currency=usd'+(T.GTR.base?'':'&token=quote'),{headers:{Accept:'application/json'}})).json();
 const L=j.data.attributes.ohlcv_list.slice().reverse();if(L.length)KG=L.map(a=>({t:Math.floor(a[0]/60),o:+a[1],h:+a[2],l:+a[3],c:+a[4]}));
 const b=KG[KG.length-1];if(b&&T.GTR.p){b.c=T.GTR.p;b.h=Math.max(b.h,b.c);b.l=Math.min(b.l,b.c);}}catch(e){}}
dexPoll();setInterval(dexPoll,10000);
const fmt=(v,d)=>v>=1000?v.toLocaleString(window.LOC||'en-US',{maximumFractionDigits:d??2}):v>=1?v.toFixed(d??3):v.toPrecision(4);
const $=id=>document.getElementById(id);
function flash(el){if(!el)return;el.classList.add('flick');setTimeout(()=>el.classList.remove('flick'),130)}
function setStatus(s,liveSt){const e=$('src');if(e)e.textContent=s;const lv=$('live');if(lv){lv.style.borderColor=liveSt?'rgba(255,255,255,.5)':'#F59E0B';lv.style.color='#fff';lv.style.background=liveSt?'rgba(16,185,129,.28)':'rgba(245,158,11,.35)';lv.style.textShadow='none';}}
/* 存檔：主帳戶 wuji_market_v1 透過共用 store.js 的 load()/save() 讀寫（只動美股帳戶 cash）；虛擬幣持倉獨立存在 wuji_crypto_v1 */
const CK='wuji_crypto_v1',FEE=0.001;
const nfu=v=>Number(v).toLocaleString(window.LOC||'en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
function gameLoad(){const g=load();return g&&g.a&&g.a.us?g:null}
function wLoad(){try{const w=JSON.parse(localStorage.getItem(CK));if(w&&w.v===1){w.firstTrade=!!w.firstTrade;return w}}catch(e){}return{v:1,pos:{},trades:[],realized:0,fees:0,firstTrade:false}}
function wSave(w){localStorage.setItem(CK,JSON.stringify(w))}
function say(t){const e=$('toast');e.textContent=t;e.style.opacity=1;clearTimeout(e._t);e._t=setTimeout(()=>e.style.opacity=0,2500)}
function trade2(side){const p=T[sel]?.p,v=parseFloat($('amt').value);if(sel==='GTR'?!gtrOK:!live)return say('目前沒有真實報價，暫停交易');if(!p||!(v>0))return say('請輸入'+(side==='B'?'金額':'數量'));
 S=gameLoad();if(!S)return say('請先到股市頁建立帳戶');const W=wLoad(),a=S.a.us;
 if(side==='B'){if(v>a.cash)return say('美股帳戶現金不足');const fee=v*FEE,q=(v-fee)/p;a.cash=+(a.cash-v).toFixed(6);const P=W.pos[sel]||(W.pos[sel]={q:0,t:0});P.q+=q;P.t+=v;W.fees+=fee;W.trades.push({ts:Date.now(),s:sel,side,q,p,amt:v,fee});if(!W.firstTrade){W.firstTrade=true;if(typeof track==='function')track('first-trade-crypto');}save();wSave(W);say(`買進 ${sel} ${q.toPrecision(6)}，花費 $${nfu(v)}`);}
 else{const P=W.pos[sel];if(!P||P.q<v-1e-12)return say('持有數量不足');const q=Math.min(v,P.q),gross=q*p,fee=gross*FEE,net=gross-fee,part=P.t*q/P.q;a.cash=+(a.cash+net).toFixed(6);W.realized+=net-part;W.fees+=fee;P.q-=q;P.t-=part;if(P.q<1e-10)delete W.pos[sel];W.trades.push({ts:Date.now(),s:sel,side,q,p,amt:net,fee});if(!W.firstTrade){W.firstTrade=true;if(typeof track==='function')track('first-trade-crypto');}save();wSave(W);say(`賣出 ${sel} ${q.toPrecision(6)}，入帳 $${nfu(net)}`);}
 $('amt').value='';tick();}
function fake(){const base={BTC:80750,ETH:3120,BNB:610,SOL:182,XRP:2.41,DOGE:.198,ADA:.72,TRX:.31,AVAX:31.2,LINK:17.4,DOT:5.6,TON:4.1,SHIB:.0000168,LTC:96,BCH:410,NEAR:4.3,UNI:9.8,APT:7.2,SUI:3.6,XLM:.38};
 BN.forEach(([s])=>T[s]={p:base[s],c:(Math.random()-.45)*8,v:Math.random()*2e9});
 let p=80000;KL=[];for(let i=0;i<80;i++){const o=p;p+= (Math.random()-.48)*120;KL.push({o,c:p,h:Math.max(o,p)+Math.random()*60,l:Math.min(o,p)-Math.random()*60});}T.BTC.p=p;}
const API='https://api.binance.com/api/v3/';let wsOK=false,poll=null;
const badge=t=>setStatus(t,true);
async function rest(full){const j=await (await fetch(API+'ticker/24hr?symbols='+encodeURIComponent(JSON.stringify(BN.map(t=>t[0]+'USDT'))))).json();
 j.forEach(x=>T[x.symbol.replace('USDT','')]={p:+x.lastPrice,c:+x.priceChangePercent,v:+x.quoteVolume});
 const k=await (await fetch(API+'klines?symbol=BTCUSDT&interval=1m&limit=80')).json();KL=k.map(a=>({o:+a[1],h:+a[2],l:+a[3],c:+a[4]}));T.BTC.p=KL[KL.length-1].c;
 const dp=await (await fetch(API+'depth?symbol=BTCUSDT&limit=10')).json();lastBook=0;book(dp.bids,dp.asks);
 const tr=await (await fetch(API+'trades?symbol=BTCUSDT&limit='+(full?16:5))).json();tr.forEach(x=>{lt=0;trade(+x.price,+x.qty,!x.isBuyerMaker)});live=true;}
function startPoll(why){if(poll)return;setStatus('REST'+(why?'·'+why:''),false);poll=setInterval(()=>rest().catch(()=>setStatus('OFFLINE',false)),3000);}
function stopPoll(){if(poll){clearInterval(poll);poll=null}}
function connect(){let ws;try{ws=new WebSocket('wss://stream.binance.com:9443/stream?streams=btcusdt@kline_1m/btcusdt@aggTrade/btcusdt@depth10@100ms/!miniTicker@arr')}catch(e){startPoll('即時串流無法使用');return}
 const to=setTimeout(()=>{if(!wsOK)startPoll('即時串流連不上')},5000);
  ws.onmessage=e=>{if(!wsOK){wsOK=true;clearTimeout(to);stopPoll();setStatus('BIN+DEX',true);}const m=JSON.parse(e.data),d=m.data;
  if(m.stream.endsWith('kline_1m')){const b={o:+d.k.o,h:+d.k.h,l:+d.k.l,c:+d.k.c};if(KL.length&&d.k.t===KL.t)KL[KL.length-1]=b;else if(KL.t&&d.k.t!==KL.t){KL.push(b);KL.shift();}else KL[KL.length-1]=b;KL.t=d.k.t;T.BTC.p=b.c;}
  else if(m.stream.endsWith('aggTrade'))trade(+d.p,+d.q,!d.m);
  else if(m.stream.includes('depth'))book(d.bids,d.asks);
  else d.forEach(x=>{const s=x.s.replace('USDT','');if(T[s]&&x.s.endsWith('USDT'))T[s].p=+x.c;});};
 ws.onclose=()=>{wsOK=false;startPoll('串流中斷，10 秒後重連');setTimeout(connect,10000);};}
async function boot(){try{await rest(true);setStatus('BIN',true);connect();}catch(e){fake();setStatus('SIM',false);setInterval(sim,400);}
  init();}
function init(){coins();setInterval(tick,1000);requestAnimationFrame(net);sparks();tick();if(typeof checkReturnDay==='function')checkReturnDay();}
function sim(){const b=KL[KL.length-1];const p=b.c+(Math.random()-.5)*25;b.c=p;b.h=Math.max(b.h,p);b.l=Math.min(b.l,p);T.BTC.p=p;
 if(Math.random()<.04){KL.push({o:p,c:p,h:p,l:p});KL.shift();}
 const bi=[],as=[];for(let i=0;i<10;i++){bi.push([p-1-i*2.5,Math.random()*2]);as.push([p+1+i*2.5,Math.random()*2]);}book(bi,as);trade(p,Math.random()*.5,Math.random()>.5);
 BN.forEach(([s])=>{if(s!=='BTC')T[s].p*=1+(Math.random()-.5)*.0008});}
let lastBook=0;function noBook(){$('asks').innerHTML='';$('bids').innerHTML='';$('midp').innerHTML='<span style="color:var(--mu)">此幣無盤口資料</span><br><small style="color:var(--ac)">DEX報價・流動性低</small>';}

/* 只讀固定高度容器的尺寸；DPR 上限 2、每張 canvas 最多 4M 像素；尺寸沒變就不重設，避免回饋迴圈 */
function fit(c){const b=c.parentElement,w=Math.max(1,b.clientWidth),h=Math.max(1,b.clientHeight);let d=Math.min(2,window.devicePixelRatio||1);if(w*h*d*d>4e6)d=Math.sqrt(4e6/(w*h));

 x.strokeStyle='#E8EBF7';for(let i=0;i<5;i++){x.beginPath();x.moveTo(0,8+i*(h-24)/4);x.lineTo(w,8+i*(h-24)/4);x.stroke();}
 const bw=(w-60)/KL.length;KL.forEach((k,i)=>{const c=k.c>=k.o?'#E11D48':'#059669';x.strokeStyle=x.fillStyle=c;const cx=i*bw+bw/2;
 x.beginPath();x.moveTo(cx,y(k.h));x.lineTo(cx,y(k.l));x.stroke();x.fillRect(i*bw+1,Math.min(y(k.o),y(k.c)),bw-2,Math.max(1,Math.abs(y(k.o)-y(k.c))));});
 const ly=y(KL[KL.length-1].c);x.setLineDash([3,3]);x.strokeStyle='#5B5CFF';x.beginPath();x.moveTo(0,ly);x.lineTo(w-58,ly);x.stroke();x.setLineDash([]);
 x.fillStyle='#5B5CFF';x.fillRect(w-58,ly-8,58,16);x.fillStyle='#fff';x.font='10px system-ui,sans-serif';x.fillText(fmt(KL[KL.length-1].c,1),w-55,ly+4);
 x.fillStyle='#4A5270';x.fillText(fmt(hi,0),w-55,14);x.fillText(fmt(lo,0),w-55,h-14);}
const CAT={GTR:'social',BTC:'pow',LTC:'pow',BCH:'pow',DOGE:'meme',SHIB:'meme',ETH:'l1',SOL:'l1',ADA:'l1',AVAX:'l1',DOT:'l1',NEAR:'l1',APT:'l1',SUI:'l1',TON:'l1',TRX:'l1',BNB:'ex',XRP:'pay',XLM:'pay',LINK:'defi',UNI:'defi'};
const NM=Object.fromEntries(TOP);let N=null,E=[],hov=null,pin=null;
function buildNet(w,h){const isNarrow=w<480;const maxN=isNarrow?12:TOP.length;N=TOP.slice(0,maxN).map(([s],i)=>{const a=i*(isNarrow?2.8:2.3),rr=Math.sqrt(i/maxN);return{s,x:w/2+Math.cos(a)*w*.44*rr,y:h/2+Math.sin(a)*h*.42*rr,vx:0,vy:0}});E=[];const deg={};
  for(let i=0;i<N.length;i++)for(let j=i+1;j<N.length;j++){const A=T[N[i].s]||{c:0},B=T[N[j].s]||{c:0},same=CAT[N[i].s]===CAT[N[j].s],cor=Math.abs(A.c-B.c)<(isNarrow?.18:.11);if(same||cor){if((deg[i]||0)<(isNarrow?3:4)&&(deg[j]||0)<(isNarrow?3:4)){deg[i]=(deg[i]||0)+1;deg[j]=(deg[j]||0)+1;E.push([i,j,same?1:(cor?0.7:0.4)]);}}} 
  if(!isNarrow&&E.length<38)for(let k=0;k<18;k++){const i=Math.floor(Math.random()*N.length),j=(i+1+Math.floor(Math.random()*(N.length-1)))%N.length;if(i!==j&&!E.some(e=>e[0]===i&&e[1]===j||e[0]===j&&e[1]===i))E.push([i,j,0.35]);}}
function net(t){const c=$('net');const[x,w,h]=fit(c);if(!N||N.w!==w){buildNet(w,h);N.w=w;}
  const vmax=Math.max(...TOP.map(([s])=>T[s].v||1));N.forEach(n=>{n.r=6+Math.sqrt((T[n.s].v||1)/vmax)*Math.min(w,h)*.09;});
  for(const a of N){a.vx+=(w/2-a.x)*.0012;a.vy+=(h/2-a.y)*.002;for(const b of N)if(a!==b){const dx=a.x-b.x,dy=a.y-b.y,d=Math.hypot(dx,dy)||1,m=a.r+b.r+Math.min(w,h)*.07;if(d<m){a.vx+=dx/d*(m-d)*.045;a.vy+=dy/d*(m-d)*.045;}}}
  N.forEach(n=>{n.vx*=.82;n.vy*=.82;n.x=Math.max(n.r,Math.min(w-n.r,n.x+n.vx));n.y=Math.max(n.r,Math.min(h-14-n.r,n.y+n.vy));});

  E.forEach(([i,j,k],ei)=>{const a=N[i],b=N[j],g=x.createLinearGradient(a.x,a.y,b.x,b.y);g.addColorStop(0,`rgba(${col(a.s)},${.18+.55*k})`);g.addColorStop(1,`rgba(${col(b.s)},${.18+.55*k})`);
   x.strokeStyle=g;x.lineWidth=k*1.1;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke();
   const p=(t/1800+ei*.11)%1;x.fillStyle='rgba(91,92,255,.85)';x.beginPath();x.arc(a.x+(b.x-a.x)*p,a.y+(b.y-a.y)*p,1.6,0,6.28);x.fill();});
  N.forEach((n,i)=>{const q=T[n.s]||{c:0},ch=Math.min(Math.abs(q.c),9)/9,pul=1+Math.sin(t/(380-ch*180)+i*1.7)*(.05+ch*.15),rr=n.r*pul,c=col(n.s),on=hov===n||pin===n;
   const gg=x.createRadialGradient(n.x,n.y,0,n.x,n.y,rr*2.6);gg.addColorStop(0,`rgba(${c},${.45+ch*.6})`);gg.addColorStop(1,`rgba(${c},0)`);x.fillStyle=gg;x.beginPath();x.arc(n.x,n.y,rr*2.6,0,6.28);x.fill();

   x.fillStyle='#fff';x.font=`bold ${Math.max(8,Math.min(12,rr*.65))}px system-ui,sans-serif`;x.textAlign='center';x.textBaseline='middle';x.fillText(n.s,n.x,n.y);});
  x.textAlign='left';x.textBaseline='alphabetic';x.fillStyle='#4A5270';x.font='11px system-ui,sans-serif';x.fillText(w<480?'節點＝幣種・大小＝成交額':'節點＝幣種  大小＝成交額  脈動＝波動  連線＝同類或走勢相近',6,h-4);
  const tn=hov||pin,tp=$('tip');if(tn){const q=T[tn.s]||{p:0,c:0,v:0};tp.style.display='block';tp.innerHTML=`<b>${tn.s}</b> ${NM[tn.s]||''}<br>價格 ${fmt(q.p)}<br><span class="${q.c>=0?'u':'d'}">24h ${q.c>=0?'+':''}${q.c.toFixed(2)}%</span><br>成交額 $${((q.v||0)/1e6).toFixed(0)}M`;
   tp.style.left=Math.max(0,Math.min(tn.x+tn.r+4,w-120))+'px';tp.style.top=Math.max(0,Math.min(tn.y-24,h-70))+'px';}else tp.style.display='none';
  requestAnimationFrame(net);}
const hit=e=>{const b=$('net').getBoundingClientRect(),mx=e.clientX-b.left,my=e.clientY-b.top;return N&&N.find(n=>Math.hypot(n.x-mx,n.y-my)<n.r+3)||null;};

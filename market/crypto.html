function fit(c){const b=c.parentElement,w=Math.max(1,b.clientWidth),h=Math.max(1,b.clientHeight);let d=Math.min(2,window.devicePixelRatio||1);if(w*h*d*d>4e6)d=Math.sqrt(4e6/(w*h));
 const W=Math.round(w*d),H=Math.round(h*d);if(c.width!==W||c.height!==H){c.width=W;c.height=H;}const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,w,h);return[x,w,h];}

 x.strokeStyle='#E8EBF7';for(let i=0;i<5;i++){x.beginPath();x.moveTo(0,8+i*(h-24)/4);x.lineTo(w,8+i*(h-24)/4);x.stroke();}
 const bw=(w-60)/KL.length;KL.forEach((k,i)=>{const c=k.c>=k.o?'#E11D48':'#059669';x.strokeStyle=x.fillStyle=c;const cx=i*bw+bw/2;
 x.beginPath();x.moveTo(cx,y(k.h));x.lineTo(cx,y(k.l));x.stroke();x.fillRect(i*bw+1,Math.min(y(k.o),y(k.c)),bw-2,Math.max(1,Math.abs(y(k.o)-y(k.c))));});
 const ly=y(KL[KL.length-1].c);x.setLineDash([3,3]);x.strokeStyle='#5B5CFF';x.beginPath();x.moveTo(0,ly);x.lineTo(w-58,ly);x.stroke();x.setLineDash([]);
 x.fillStyle='#5B5CFF';x.fillRect(w-58,ly-8,58,16);x.fillStyle='#fff';x.font='10px system-ui,sans-serif';x.fillText(fmt(KL[KL.length-1].c,1),w-55,ly+4);
 x.fillStyle='#4A5270';x.fillText(fmt(hi,0),w-55,14);x.fillText(fmt(lo,0),w-55,h-14);}

function buildNet(w,h){const isNarrow=w<480;const maxN=isNarrow?12:TOP.length;N=TOP.slice(0,maxN).map(([s],i)=>{const a=i*(isNarrow?2.8:2.3),rr=Math.sqrt(i/maxN);return{s,x:w/2+Math.cos(a)*w*.44*rr,y:h/2+Math.sin(a)*h*.42*rr,vx:0,vy:0}});E=[];const deg={};
  for(let i=0;i<N.length;i++)for(let j=i+1;j<N.length;j++){const A=T[N[i].s]||{c:0},B=T[N[j].s]||{c:0},same=CAT[N[i].s]===CAT[N[j].s],cor=Math.abs(A.c-B.c)<(isNarrow?.18:.11);if(same||cor){if((deg[i]||0)<(isNarrow?3:4)&&(deg[j]||0)<(isNarrow?3:4)){deg[i]=(deg[i]||0)+1;deg[j]=(deg[j]||0)+1;E.push([i,j,same?1:(cor?0.7:0.4)]);}}} 
  if(!isNarrow&&E.length<38)for(let k=0;k<18;k++){const i=Math.floor(Math.random()*N.length),j=(i+1+Math.floor(Math.random()*(N.length-1)))%N.length;if(i!==j&&!E.some(e=>e[0]===i&&e[1]===j||e[0]===j&&e[1]===i))E.push([i,j,0.35]);}}
function net(t){const c=$('net');const[x,w,h]=fit(c);if(!N||N.w!==w){buildNet(w,h);N.w=w;}

  E.forEach(([i,j,k],ei)=>{const a=N[i],b=N[j],g=x.createLinearGradient(a.x,a.y,b.x,b.y);g.addColorStop(0,`rgba(${col(a.s)},${.18+.55*k})`);g.addColorStop(1,`rgba(${col(b.s)},${.18+.55*k})`);
   x.strokeStyle=g;x.lineWidth=k*1.1;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke();
   const p=(t/1800+ei*.11)%1;x.fillStyle='rgba(91,92,255,.85)';x.beginPath();x.arc(a.x+(b.x-a.x)*p,a.y+(b.y-a.y)*p,1.6,0,6.28);x.fill();});
  N.forEach((n,i)=>{const q=T[n.s]||{c:0},ch=Math.min(Math.abs(q.c),9)/9,pul=1+Math.sin(t/(380-ch*180)+i*1.7)*(.05+ch*.15),rr=n.r*pul,c=col(n.s),on=hov===n||pin===n;
   const gg=x.createRadialGradient(n.x,n.y,0,n.x,n.y,rr*2.6);gg.addColorStop(0,`rgba(${c},${.45+ch*.6})`);gg.addColorStop(1,`rgba(${c},0)`);x.fillStyle=gg;x.beginPath();x.arc(n.x,n.y,rr*2.6,0,6.28);x.fill();

  x.textAlign='left';x.textBaseline='alphabetic';x.fillStyle='#4A5270';x.font='11px system-ui,sans-serif';x.fillText(w<480?'節點＝幣種・大小＝成交額':'節點＝幣種  大小＝成交額  脈動＝波動  連線＝同類或走勢相近',6,h-4);

   tp.style.left=Math.max(0,Math.min(tn.x+tn.r+4,w-120))+'px';tp.style.top=Math.max(0,Math.min(tn.y-24,h-70))+'px';}else tp.style.display='none';

<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>舞吉股市大亨 · 動畫試作</title>
<style>
:root{--bg:#0d0b07;--card:#1a160e;--gold:#f5c542;--gold2:#c98a12;--up:#ff5a5a;--txt:#f3ead2;--mut:#9a8f74}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:radial-gradient(120% 70% at 50% 0%,#2a2010,var(--bg) 60%);color:var(--txt);font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;overflow:hidden}
.wrap{max-width:430px;margin:0 auto;padding:22px 18px;position:relative;height:100%}
.top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--mut)}
.lv{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#2a1a00;font-weight:800;padding:4px 12px;border-radius:99px;will-change:transform}
.hero{margin:26px 0 8px;text-align:center}
.hero small{color:var(--mut);letter-spacing:2px}
.num{font-size:44px;font-weight:900;font-variant-numeric:tabular-nums;background:linear-gradient(180deg,#fff3c4,var(--gold) 50%,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent;will-change:transform;display:inline-block}
.chg{color:var(--up);font-weight:700;margin-top:4px}
.bar{height:10px;border-radius:9px;background:#2b2415;margin:18px 4px 6px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;transform-origin:left;transform:scaleX(0);background:linear-gradient(90deg,var(--gold2),var(--gold))}
.barl{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);padding:0 4px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
.card{background:var(--card);border:1px solid #3a3020;border-radius:16px;padding:14px;visibility:hidden}
.card b{display:block;font-size:20px;color:var(--gold);margin-top:6px}.card span{font-size:12px;color:var(--mut)}
.btn{display:block;width:100%;margin-top:22px;padding:16px;border:0;border-radius:16px;font-size:18px;font-weight:800;color:#2a1a00;background:linear-gradient(180deg,#ffe07a,var(--gold2));box-shadow:0 6px 0 #7a5208,0 10px 24px #0008;will-change:transform}
.note{font-size:11px;color:var(--mut);text-align:center;margin-top:12px}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.coin{position:absolute;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6c9,var(--gold) 45%,var(--gold2));box-shadow:inset 0 -3px 0 #8a5a06;font:900 14px sans-serif;color:#8a5a06;display:grid;place-items:center}
.burst{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-size:54px;font-weight:900;color:var(--gold);text-shadow:0 0 24px #ffb30088,0 4px 0 #7a5208;visibility:hidden;white-space:nowrap}
.ring{position:absolute;left:50%;top:38%;width:120px;height:120px;margin:-60px;border:4px solid var(--gold);border-radius:50%;visibility:hidden}
</style></head><body><div class="wrap">
<div class="top"><span>🏦 我的金庫</span><span class="lv" id="lv">Lv.3 街角小店</span></div>
<div class="hero"><small>總資產（模擬）</small><br><span class="num" id="num">NT$100,000</span><div class="chg" id="chg">▲ +0.00%</div></div>
<div class="bar"><i id="bar"></i></div><div class="barl"><span>下一級：大亨塔</span><span id="pct">0%</span></div>
<div class="cards">
<div class="card"><span>台股帳戶</span><b>NT$62.4萬</b></div><div class="card"><span>美股帳戶</span><b>US$1.2萬</b></div>
<div class="card"><span>今日排名</span><b>第 2 名</b></div><div class="card"><span>連勝天數</span><b>🔥 5 天</b></div></div>
<button class="btn" id="btn">領取收盤獎勵</button>
<div class="note">遊戲模擬資產・非投資建議</div>
<div id="fx"><div class="ring" id="ring"></div><div class="burst" id="burst">升級！</div></div>
</div>
<script src="vendor/gsap.min.js"></script>
<script>
const $=s=>document.querySelector(s),fmt=v=>'NT$'+Math.round(v).toLocaleString('en-US');
const cap=/cap=1/.test(location.search);
function coins(tl,at){const fx=$('#fx');for(let i=0;i<18;i++){const c=document.createElement('div');c.className='coin';c.textContent='$';fx.appendChild(c);
 const a=(i/18)*Math.PI*2+gsap.utils.random(-.2,.2),r=gsap.utils.random(110,190);
 gsap.set(c,{left:'50%',top:'38%',xPercent:-50,yPercent:-50,autoAlpha:0});
 tl.fromTo(c,{x:0,y:0,scale:.3,autoAlpha:1,rotation:0},{x:Math.cos(a)*r,y:Math.sin(a)*r,scale:1,rotation:gsap.utils.random(-360,360),duration:.7,ease:'power3.out',immediateRender:false},at)
   .to(c,{y:'+=260',autoAlpha:0,duration:.9,ease:'power2.in'},at+.7)}}
function build(reduce){
 const o={v:1e5},tl=gsap.timeline({paused:cap,defaults:{ease:'power3.out'}});
 if(reduce){gsap.set('.card',{autoAlpha:1});$('#num').textContent=fmt(1e6);$('#chg').textContent='▲ +900.00%';gsap.set('#bar',{scaleX:1});$('#pct').textContent='100%';$('#lv').textContent='Lv.4 舞吉大亨塔';return tl}
 tl.from('.hero,.top,.bar,.barl',{y:20,autoAlpha:0,stagger:.08,duration:.5})
   .to('.card',{startAt:{y:40,scale:.9,autoAlpha:0},y:0,scale:1,autoAlpha:1,stagger:{each:.09,from:'start'},duration:.6,ease:'back.out(1.6)'},'-=.2')
   .to(o,{v:1e6,duration:2.4,ease:'power2.inOut',onUpdate(){$('#num').textContent=fmt(o.v);$('#chg').textContent='▲ +'+((o.v/1e5-1)*100).toFixed(2)+'%'}},'+=.1')
   .to('#bar',{scaleX:1,duration:2.4,ease:'power2.inOut',onUpdate(){$('#pct').textContent=Math.round(gsap.getProperty('#bar','scaleX')*100)+'%'}},'<')
   .to('#num',{scale:1.15,duration:.15,yoyo:true,repeat:1,ease:'power1.inOut'})
   .addLabel('up')
   .fromTo('#burst',{scale:0,rotation:-12,autoAlpha:1},{scale:1,rotation:0,duration:.6,ease:'elastic.out(1,.45)'},'up')
   .fromTo('#ring',{scale:.2,autoAlpha:1},{scale:4,autoAlpha:0,duration:.9,ease:'expo.out'},'up')
   .call(()=>{$('#lv').textContent='Lv.4 舞吉大亨塔'},null,'up')
   .fromTo('#lv',{scale:1},{scale:1.3,duration:.2,yoyo:true,repeat:1},'up');
 coins(tl,tl.labels.up);
 tl.to('#burst',{autoAlpha:0,y:-40,duration:.4,ease:'power2.in'},'up+=1.5')
   .to('#btn',{scale:.94,y:5,boxShadow:'0 1px 0 #7a5208,0 4px 10px #0008',duration:.1,ease:'power1.in'},'up+=1.7')
   .to('#btn',{scale:1,y:0,boxShadow:'0 6px 0 #7a5208,0 10px 24px #0008',duration:.5,ease:'elastic.out(1,.4)'});
 return tl}
let mm=gsap.matchMedia();
mm.add({ok:'(prefers-reduced-motion: no-preference)',reduce:'(prefers-reduced-motion: reduce)'},ctx=>{window.TL=build(ctx.conditions.reduce)});
const b=$('#btn');b.addEventListener('pointerdown',()=>gsap.to(b,{scale:.94,y:5,duration:.1,overwrite:true}));
b.addEventListener('pointerup',()=>gsap.to(b,{scale:1,y:0,duration:.5,ease:'elastic.out(1,.4)',overwrite:true}));
window.ready=true;
</script></body></html>
